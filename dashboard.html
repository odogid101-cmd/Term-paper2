<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tempaper | Academic Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a1020;
      --bg-2: #111827;
      --sidebar: rgba(15, 23, 42, 0.95);
      --panel: rgba(15, 23, 42, 0.88);
      --card: #111827;
      --card-strong: #1f2937;
      --text: #e5eefb;
      --muted: #a7b4c9;
      --border: rgba(148, 163, 184, 0.18);
      --soft-border: rgba(163, 180, 209, 0.12);
      --accent: #6366f1;
      --accent-2: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --success: #22c55e;
      --danger: #ef4444;
      --paper-bg: #ffffff;
      --paper-text: #0f172a;
      --paper-muted: #475569;
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.24);
      --shadow-card: 0 10px 32px rgba(15, 23, 42, 0.18);
      --sidebar-width: 260px;
      --topbar-height: 68px;
    }

    [data-theme="light"] {
      --bg: #edf3ff;
      --bg-2: #f8fafc;
      --sidebar: rgba(255,255,255,0.96);
      --panel: rgba(255,255,255,0.96);
      --card: #ffffff;
      --card-strong: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(15, 23, 42, 0.08);
      --soft-border: rgba(15, 23, 42, 0.05);
      --paper-bg: #ffffff;
      --paper-text: #0f172a;
      --paper-muted: #475569;
      --shadow-soft: 0 14px 28px rgba(15, 23, 42, 0.08);
      --shadow-card: 0 10px 18px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    img, svg { display: block; }
    button, input, textarea { font: inherit; }
    button { border: none; background: none; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.26);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.38); }

    .app-shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    .sidebar {
      position: relative;
      width: var(--sidebar-width);
      height: 100%;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 18px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 40;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 18px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--accent-gradient);
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.35);
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-label {
      margin: 8px 10px 4px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 12px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: left;
    }

    .nav-item:hover,
    .nav-item.active {
      color: var(--text);
      background: rgba(255,255,255,0.04);
      border-color: var(--soft-border);
    }

    .nav-item-main {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 500;
    }

    .nav-item svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item .badge {
      min-width: 22px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.16);
      display: grid;
      place-items: center;
      color: var(--text);
      font-size: 10px;
      font-weight: 700;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .profile-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .profile-box:hover {
      background: rgba(255,255,255,0.04);
      transform: translateY(-1px);
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
      color: white;
      background: var(--accent-gradient);
      box-shadow: 0 10px 18px rgba(99, 102, 241, 0.25);
    }

    .profile-meta {
      overflow: hidden;
      min-width: 0;
    }

    .profile-name {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-email {
      color: var(--muted);
      font-size: 11.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: var(--topbar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px 0 28px;
      background: rgba(9, 13, 22, 0.42);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      position: relative;
      z-index: 25;
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,0.08);
      transform: translateY(-1px);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .workspace {
      flex: 1;
      overflow: auto;
      padding: 28px 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.04), transparent 120px);
    }

    .action-row {
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
    }

    .primary-btn, .secondary-btn, .ghost-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .primary-btn {
      background: var(--accent-gradient);
      color: white;
      border: 1px solid transparent;
      padding: 10px 16px;
      box-shadow: 0 14px 22px rgba(99, 102, 241, 0.18);
    }

    .secondary-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
    }

    .ghost-btn {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: var(--text);
      padding: 10px 14px;
    }

    .primary-btn:hover, .secondary-btn:hover, .ghost-btn:hover {
      transform: translateY(-1px);
    }

    .document-shell {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .document-meta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px 12px 0 0;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .paper-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .paper-page {
      position: relative;
      width: 100%;
      min-height: 1060px;
      background: var(--paper-bg);
      color: var(--paper-text);
      box-shadow: var(--shadow-card);
      border-radius: 2px;
      border: 1px solid rgba(15, 23, 42, 0.06);
      overflow: hidden;
      page-break-after: always;
    }

    .paper-page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.02), transparent 18%, transparent 82%, rgba(15, 23, 42, 0.02));
      pointer-events: none;
    }

    .paper-inner {
      position: relative;
      z-index: 1;
      min-height: 1060px;
      padding: 70px 78px 70px;
      font-family: 'Merriweather', Georgia, serif;
      line-height: 1.8;
      font-size: 15px;
      color: var(--paper-text);
    }

    .page-number {
      position: absolute;
      right: 24px;
      bottom: 18px;
      color: var(--paper-text);
      background: rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(15, 23, 42, 0.06);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      z-index: 2;
    }

    .cover-page .paper-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-top: 120px;
      padding-bottom: 120px;
    }

    .cover-box {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .cover-title {
      margin: 0;
      font-family: 'Inter', sans-serif;
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      line-height: 1.25;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--paper-text);
      text-align: center;
    }

    .cover-subtitle,
    .cover-meta {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      letter-spacing: 0.04em;
      color: var(--paper-muted);
      text-transform: uppercase;
      text-align: center;
      font-weight: 600;
    }

    .cover-meta {
      margin-top: 6px;
      text-transform: none;
      letter-spacing: 0.01em;
      text-align: center;
      line-height: 1.7;
    }

    .preliminary-page .paper-inner,
    .toc-page .paper-inner,
    .chapter-page .paper-inner {
      text-align: justify;
    }

    .section-heading {
      margin: 0 0 18px;
      font-family: 'Inter', sans-serif;
      text-align: center;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-size: clamp(1.3rem, 2.1vw, 2rem);
      color: var(--paper-text);
    }

    .content-body {
      font-size: 15px;
      color: var(--paper-muted);
      line-height: 1.8;
    }

    .content-body p {
      margin: 0 0 14px;
      text-align: justify;
    }

    .toc-page .section-heading {
      text-align: left;
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
    }

    .toc-heading-main {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--paper-text);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .toc-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toc-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px dotted rgba(15, 23, 42, 0.13);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      text-align: left;
    }

    .toc-label {
      flex: 1;
      min-width: 0;
      color: var(--paper-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .toc-page-no {
      min-width: 30px;
      text-align: right;
      color: var(--paper-muted);
      font-weight: 700;
    }

    .chapter-page .chapter-title {
      font-family: 'Inter', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 14px 0 22px;
      text-align: center;
      color: var(--paper-text);
    }

    .chapter-page .content-body h2,
    .chapter-page .content-body h3 {
      font-family: 'Inter', sans-serif;
      margin: 18px 0 10px;
      color: var(--paper-text);
      text-align: left;
    }

    .chapter-page .content-body h2 {
      font-size: 1.3rem;
      font-weight: 800;
      border-left: 4px solid var(--accent);
      padding-left: 12px;
    }

    .chapter-page .content-body h3 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .chapter-page .content-body ul,
    .chapter-page .content-body ol {
      margin: 10px 0 16px 20px;
      color: var(--paper-muted);
    }

    .chapter-page .content-body li { margin-bottom: 8px; }

    .chapter-page .content-body strong { color: var(--paper-text); }

    .muted-note {
      font-size: 12px;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
    }

    .empty-state {
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 26px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,0.02);
      box-shadow: var(--shadow-card);
      color: var(--muted);
      line-height: 1.7;
    }

    .empty-state h2 {
      margin: 0 0 10px;
      font-size: clamp(1.25rem, 2vw, 1.7rem);
      color: var(--text);
      font-weight: 700;
    }

    @media (max-width: 980px) {
      .sidebar {
        width: 220px;
      }
      .topbar {
        padding-left: 22px;
      }
      .paper-inner {
        padding-left: 52px;
        padding-right: 52px;
      }
    }

    @media (max-width: 840px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        transform: translateX(-100%);
        transition: transform 0.28s ease;
        width: min(82vw, 280px);
        z-index: 80;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        width: 100%;
      }

      .workspace {
        padding: 20px 16px 26px;
      }

      .document-meta {
        padding: 10px 12px;
      }

      .paper-inner {
        min-height: auto;
        padding: 42px 28px 54px;
      }

      .paper-page {
        min-height: 880px;
      }

      .cover-page .paper-inner {
        padding-top: 90px;
      }
    }

    @media (max-width: 560px) {
      .topbar {
        padding: 0 14px;
      }

      .topbar-title {
        font-size: 14px;
      }

      .action-row {
        justify-content: stretch;
      }

      .action-row > * {
        flex: 1;
      }

      .paper-page {
        min-height: 760px;
      }

      .paper-inner {
        padding: 36px 20px 48px;
      }

      .section-heading {
        font-size: 1.4rem;
      }

      .cover-title {
        letter-spacing: 0.06em;
      }

      .toc-item {
        gap: 10px;
      }

      .toc-label {
        white-space: normal;
      }
    }

    @media print {
      body {
        background: white;
      }

      .sidebar,
      .topbar,
      .action-row,
      .ai-fab,
      .ai-chat-window {
        display: none !important;
      }

      .workspace {
        padding: 0;
        overflow: visible;
      }

      .document-shell {
        max-width: 100%;
      }

      .paper-page {
        box-shadow: none;
        border: none;
        min-height: 0;
      }

      .paper-inner {
        min-height: 0;
      }

      .page-number {
        background: transparent;
        border: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <span>Tempaper</span>
      </div>

      <div class="nav-group">
        <div class="section-label">Workspace</div>

        <button class="nav-item active" type="button" data-action="new-project">
          <span class="nav-item-main">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            New Project
          </span>
        </button>

        <button class="nav-item" type="button" data-action="prompt-builder">
          <span class="nav-item-main">
            <svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/><path d="M18 15v6m-3-3h6"/></svg>
            Prompt Builder
          </span>
        </button>

        <button class="nav-item" type="button" data-action="history">
          <span class="nav-item-main">
            <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            History
          </span>
          <span class="badge">4</span>
        </button>
      </div>

      <div class="nav-group">
        <div class="section-label">Tools</div>

        <button class="nav-item" type="button" data-action="export">
          <span class="nav-item-main">
            <svg viewBox="0 0 24 24"><path d="M12 3v12M7 19l5 5 5-5"/><path d="M3 19v1h18v-1"/></svg>
            Export
          </span>
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="profile-box">
          <div class="avatar">TD</div>
          <div class="profile-meta">
            <div class="profile-name">Temi Durojaiye</div>
            <div class="profile-email">td@tempaper.app</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">Academic Workspace</div>

        <div class="topbar-actions">
          <button class="icon-btn" type="button" aria-label="Toggle sidebar" id="nav-toggle">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <button class="icon-btn" type="button" aria-label="More actions">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
          </button>
        </div>
      </header>

      <section class="workspace">
        <div class="action-row">
          <button class="secondary-btn" type="button" id="generatePrelimBtn">Generate Preliminary</button>
          <button class="primary-btn" type="button" id="nextStageBtn">Pull Next</button>
          <button class="ghost-btn" type="button" id="updateTocBtn">Update TOC</button>
          <button class="secondary-btn" type="button" id="resetDraftBtn">Reset Draft</button>
        </div>

        <div class="document-shell">
          <div class="document-meta">
            <span id="documentInfo">Draft status: Ready</span>
            <span id="pagesCount">Pages: 0</span>
          </div>

          <div class="paper-stack" id="paperStack"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const topic = 'AI-Driven Climate Monitoring for Sustainable Agriculture';
    const author = 'Temi Durojaiye';
    const school = 'Department of Computer Science';
    const semester = 'Final Year Project';

    const paperData = {
      topic,
      acknowledgement:
        'I would like to express my sincere gratitude to my supervisor, lecturers, and family for their support, guidance, and encouragement throughout this project. The completion of this work on AI-Driven Climate Monitoring for Sustainable Agriculture would not have been possible without their constructive feedback and unwavering motivation. I also appreciate the technical support and resources made available to me during the research process, which enabled me to carry out a detailed and meaningful analysis. This project has strengthened my understanding of the role of intelligent systems in addressing environmental and agricultural challenges, and I am grateful for the opportunity to contribute to this critical field.',
      abstract:
        'This paper examines the use of artificial intelligence in climate monitoring and sustainable agriculture. It highlights how intelligent data-driven systems can improve crop monitoring, weather prediction, and resource efficiency, thereby supporting environmental sustainability and food security. The study explores the integration of machine learning, remote sensing, and data analytics in agricultural decision-making, while also considering the challenges of implementation, data quality, and scalability. The research demonstrates that AI-based systems can transform traditional farming practices by enabling timely interventions, reducing waste, and improving resilience to climate variability. Overall, the paper argues that sustainable agricultural development depends on the strategic adoption of AI-enabled climate monitoring technologies.',
      chapters: [
        { title: 'Introduction', body: '<p>Climate change continues to threaten food production, rural livelihoods, and environmental stability across the world. In this context, smart agricultural systems have become increasingly important because they enable farmers to make timely, evidence-based decisions. This chapter introduces the background of the study, the problem statement, the objectives, and the structure of the paper. It highlights the need for data-driven solutions that can address climate unpredictability while improving productivity and sustainability.</p><p>The importance of technology in agriculture has grown rapidly because traditional farming methods are often unable to cope with changing weather conditions, soil deterioration, and rising resource costs. Artificial intelligence offers promising opportunities for climate monitoring by analysing large datasets, identifying patterns, and supporting early intervention strategies. This study therefore focuses on the role of AI in climate monitoring for sustainable agriculture, with emphasis on practical applications, benefits, and constraints.</p>' },
        { title: 'Literature Review', body: '<p>Several studies have shown that artificial intelligence can improve agricultural productivity by supporting prediction, planning, and optimization. Machine learning models are commonly used to estimate yields, detect crop disease, and analyse weather-related risk factors. Remote sensing technologies also produce large volumes of geospatial data that can support climate monitoring and land management. When combined with AI, these systems provide a stronger basis for decision-making and early warning.</p><p>Existing literature also reveals that climate variability remains a major challenge for farmers. Drought, rainfall unpredictability, flooding, and disease outbreaks can reduce productivity and cause financial stress. Therefore, the development of intelligent monitoring systems is essential to help farmers respond more rapidly and reduce losses. This review demonstrates that AI applications in agriculture are increasingly relevant, though more work is needed to improve accessibility, affordability, and local adaptation.</p>' },
        { title: 'Methodology', body: '<p>This study adopts a mixed analytical approach combining conceptual review and practical case analysis. Relevant literature was reviewed to identify existing techniques, technologies, and implementation challenges related to AI-based climate monitoring in agriculture. The analysis also evaluates how data collection methods, predictive models, and remote sensing systems can support climate resilience.</p><p>The methodology focuses on identifying the most relevant indicators used in agricultural monitoring, including rainfall patterns, soil moisture, temperature trends, crop health, and yield productivity. These indicators are used to explain how AI tools can generate insight and support better farm-level decisions. This approach provides a clear framework for understanding both the opportunities and constraints of integrating AI into sustainable farming systems.</p>' },
        { title: 'Findings and Discussion', body: '<p>The findings suggest that AI-driven monitoring systems offer tangible benefits in the agricultural sector. They improve forecasting accuracy, reduce uncertainty, and enable timely responses to climate-related stress. For instance, predictive models can detect anomalies in rainfall or temperature patterns and guide farmers toward more adaptive strategies. In addition, AI-supported systems help optimize irrigation, monitor crop health, and improve resource allocation.</p><p>However, the findings also show that implementation challenges remain. Limited access to high-quality data, poor digital infrastructure, and lack of technical capacity can hinder adoption, particularly in rural communities. Therefore, sustainable integration requires investment in data systems, farmer training, and inclusive policy support. The discussion emphasizes that AI should be applied as a practical tool for decision support rather than as a replacement for local agricultural knowledge.</p>' },
        { title: 'Conclusion and Recommendations', body: '<p>In conclusion, AI-driven climate monitoring represents a practical and significant pathway toward sustainable agriculture. By combining environmental data with advanced analytical methods, farmers and decision-makers can respond more proactively to climate vulnerabilities. The study highlights the importance of adopting intelligent systems that support resilience, productivity, and long-term environmental stewardship.</p><p>It is recommended that governments, research institutions, and agricultural stakeholders invest in digital infrastructure, data collection networks, and farmer education programmes. These actions would improve access to AI-backed tools and encourage wider adoption. With the right support, AI-powered climate monitoring can contribute meaningfully to sustainable food systems and climate resilience.</p>' }
      ]
    };

    const state = {
      draftPages: [],
      prelimGenerated: false,
      tocInserted: false,
      currentStage: 'ready'
    };

    const paperStack = document.getElementById('paperStack');
    const documentInfo = document.getElementById('documentInfo');
    const pagesCount = document.getElementById('pagesCount');
    const sidebar = document.getElementById('sidebar');
    const navToggle = document.getElementById('nav-toggle');

    function formatChapterNumber(index) {
      return `${index + 1}`;
    }

    function makeCoverPage() {
      return `
        <article class="paper-page cover-page">
          <div class="paper-inner">
            <div class="cover-box">
              <h1 class="cover-title">${paperData.topic.toUpperCase()}</h1>
              <div class="cover-subtitle">Research Project</div>
              <div class="cover-meta">${school}<br>${semester}<br>${author}</div>
            </div>
          </div>
          <div class="page-number">Cover</div>
        </article>
      `;
    }

    function makePreliminaryPage(title, body) {
      return `
        <article class="paper-page preliminary-page">
          <div class="paper-inner">
            <h2 class="section-heading">${title}</h2>
            <div class="content-body">${body}</div>
          </div>
          <div class="page-number">${title}</div>
        </article>
      `;
    }

    function chapterMarkup(item, index) {
      return `
        <article class="paper-page chapter-page" data-chapter="${index}">
          <div class="paper-inner">
            <h2 class="chapter-title">Chapter ${index + 1}</h2>
            <div class="content-body">
              <h2>${item.title}</h2>
              ${item.body}
            </div>
          </div>
          <div class="page-number">${index + 1}</div>
        </article>
      `;
    }

    function makeTocPage() {
      const tocItems = [
        { label: 'Acknowledgement', page: 'ii' },
        { label: 'Abstract', page: 'iii' },
        ...paperData.chapters.map((chapter, index) => ({ label: `Chapter ${index + 1}: ${chapter.title}`, page: `${index + 4}` }))
      ];

      const rows = tocItems.map(item => `
        <li class="toc-item">
          <span class="toc-label">${item.label}</span>
          <span class="toc-page-no">${item.page}</span>
        </li>
      `).join('');

      return `
        <article class="paper-page toc-page">
          <div class="paper-inner">
            <div class="toc-heading-main">Table of contents</div>
            <ul class="toc-list">${rows}</ul>
          </div>
          <div class="page-number">TOC</div>
        </article>
      `;
    }

    function renderPaper() {
      paperStack.innerHTML = state.draftPages.join('');
      pagesCount.textContent = `Pages: ${state.draftPages.length}`;
    }

    function generatePreliminary() {
      const preliminaryPages = [
        makeCoverPage(),
        makePreliminaryPage('Acknowledgement', `<p>${paperData.acknowledgement}</p>`),
        makePreliminaryPage('Abstract', `<p>${paperData.abstract}</p>`)
      ];

      state.draftPages = preliminaryPages;
      state.prelimGenerated = true;
      state.tocInserted = false;
      state.currentStage = 'preliminary';
      documentInfo.textContent = 'Draft status: Preliminary generated';
      renderPaper();
    }

    function insertTocAndChapters() {
      if (!state.prelimGenerated) {
        generatePreliminary();
      }

      const chapterPages = paperData.chapters.map((chapter, index) => chapterMarkup(chapter, index));
      const pages = [...state.draftPages, makeTocPage(), ...chapterPages];
      state.draftPages = pages;
      state.tocInserted = true;
      state.currentStage = 'toc-ready';
      documentInfo.textContent = 'Draft status: TOC inserted before chapter one';
      renderPaper();
    }

    function updateToc() {
      const chapterPages = paperData.chapters.map((chapter, index) => chapterMarkup(chapter, index));
      let pages = [];

      if (state.prelimGenerated) {
        pages = [...state.draftPages.filter(page => !page.includes('toc-page'))];
      } else {
        pages = [makeCoverPage(), makePreliminaryPage('Acknowledgement', `<p>${paperData.acknowledgement}</p>`), makePreliminaryPage('Abstract', `<p>${paperData.abstract}</p>` )];
      }

      const toc = makeTocPage();
      pages.push(toc, ...chapterPages);
      state.draftPages = pages;
      state.tocInserted = true;
      state.currentStage = 'updated';
      documentInfo.textContent = 'Draft status: TOC refreshed to current stage';
      renderPaper();
    }

    function resetDraft() {
      state.draftPages = [];
      state.prelimGenerated = false;
      state.tocInserted = false;
      state.currentStage = 'ready';
      documentInfo.textContent = 'Draft status: Ready';
      paperStack.innerHTML = `
        <div class="empty-state">
          <h2>Start your paper draft</h2>
          <div>Generate the preliminary pages, add the full TOC, and continue with chapter flow when ready.</div>
        </div>
      `;
      pagesCount.textContent = 'Pages: 0';
    }

    document.getElementById('generatePrelimBtn').addEventListener('click', generatePreliminary);
    document.getElementById('nextStageBtn').addEventListener('click', insertTocAndChapters);
    document.getElementById('updateTocBtn').addEventListener('click', updateToc);
    document.getElementById('resetDraftBtn').addEventListener('click', resetDraft);

    navToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    document.querySelectorAll('[data-action]').forEach(button => {
      button.addEventListener('click', () => {
        if (button.dataset.action === 'new-project') {
          resetDraft();
        }
      });
    });

    resetDraft();
  </script>
</body>
</html>
