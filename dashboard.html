<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tempaper | Academic Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090d16; --sidebar: #0f172a; --panel: rgba(15, 23, 42, 0.9); --card: #1e293b; --accent: #4f46e5;
  --text: #f8fafc; --muted: #94a3b8; --border: rgba(255,255,255,0.08); --sidebar-width: 260px; --topbar-height: 62px;
  --paper-bg: #ffffff; --paper-text: #000000;
  --a4-width: 210mm; --a4-height: 297mm; --a4-margin: 25.4mm;
  --a4-header-height: 10mm; --a4-footer-height: 12mm;
  --a4-content-width: calc(var(--a4-width) - (var(--a4-margin) * 2));
  --a4-content-height: calc(var(--a4-height) - (var(--a4-margin) * 2) - var(--a4-header-height) - var(--a4-footer-height));
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
body { background: var(--bg); color: var(--text); width: 100vw; height: 100vh; overflow: hidden; }
button, input, textarea { font: inherit; } button { border: none; background: none; }
::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.26); border-radius: 10px; }
.sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar-width); background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 16px 14px; z-index: 1000; }
.logo { display: flex; align-items: center; gap: 12px; padding: 4px 8px 18px; font-weight: 800; font-size: 18px; color: var(--text); }
.logo-dot { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); }
.menu-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; margin-bottom: 4px; border-radius: 10px; color: var(--muted); cursor: pointer; }
.menu-item:hover,.menu-item.active { color: var(--text); background: rgba(255,255,255,0.04); }
.menu-left { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 13.5px; }
.submenu { display: none; margin: 2px 0 8px; padding-left: 8px; max-height: 260px; overflow-y: auto; }.submenu.show { display: block; }
.submenu-item { padding: 9px 12px; border-radius: 8px; color: var(--muted); font-size: 13px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-bottom { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); }
.profile-box { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 10px; cursor: pointer; }
.profile-avatar { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; }
.main { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); height: 100vh; display: flex; flex-direction: column; }
.topbar { height: var(--topbar-height); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--border); background: rgba(9,13,22,0.72); backdrop-filter: blur(12px); }
.chat-area { flex: 1; overflow-y: auto; padding: 30px 24px 26px; display: flex; flex-direction: column; gap: 18px; }
.chat-msg { max-width: 860px; width: 100%; margin: 0 auto; }
.chat-msg.user { align-self: flex-end; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border-radius: 14px 14px 14px 4px; padding: 14px 18px; font-size: 14.5px; }

/* --- FIXED A4 PAPER STYLES --- */
.document-stats { max-width: 860px; width: 100%; margin: 0 auto 12px; padding: 12px 16px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.pages-container { width: 100%; display: flex; flex-direction: column; gap: 18px; align-items: center; padding-bottom: 12px; }
.a4-page { width: var(--a4-width); height: var(--a4-height); background: #ffffff; color: #000000; border: 1px solid #e5e7eb; position: relative; overflow: hidden; font-family: "Times New Roman", Times, serif!important; }
.a4-inner { position: absolute; left: var(--a4-margin); top: var(--a4-margin); width: var(--a4-content-width); height: calc(var(--a4-height) - (var(--a4-margin) * 2)); box-sizing: border-box; }
.a4-header { height: var(--a4-header-height); font-family: "Times New Roman", Times, serif!important; font-size: 10pt!important; color: #000; display: flex; align-items: center; }
.a4-body { height: var(--a4-content-height); overflow: hidden; }
.a4-content { width: 100%; height: 100%; font-family: "Times New Roman", Times, serif!important; font-size: 12pt!important; line-height: 2.0!important; color: #000!important; word-wrap: break-word; overflow-wrap: break-word; hyphens: none!important; text-align: justify; }
.a4-content h1,.a4-content h2,.a4-content h3 { font-family: "Times New Roman", Times, serif!important; font-size: 14pt!important; font-weight: bold!important; color: #000!important; margin-top: 12pt!important; margin-bottom: 6pt!important; text-align: left!important; }
.a4-content h1 { font-size: 16pt!important; text-align: center!important; }
.a4-content p { font-family: "Times New Roman", Times, serif!important; font-size: 12pt!important; margin-bottom: 12pt!important; text-align: justify!important; }
.a4-content strong,.a4-content b { font-family: "Times New Roman", Times, serif!important; font-weight: bold!important; font-size: 12pt!important; }
.a4-content em,.a4-content i { font-family: "Times New Roman", Times, serif!important; font-style: italic!important; font-size: 12pt!important; }
.a4-content ul,.a4-content ol { margin: 0 0 12pt 18pt!important; font-size: 12pt!important; }
.a4-footer { height: var(--a4-footer-height); display: flex; align-items: center; justify-content: center; position: absolute; bottom: 0; left: 0; width: 100%; font-family: "Times New Roman", Times, serif!important; font-size: 12pt!important; color: #000!important; }

.loading-container { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 32px 24px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 14px; }
.dot-loader { display: flex; gap: 10px; }.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); animation: bounce 1.4s infinite ease-in-out; }
.dot:nth-child(1) { animation-delay: -0.32s; }.dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%,80%,100% { transform: scale(0.8); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
.input-container { padding: 16px 24px 24px; background: var(--bg); border-top: 1px solid var(--border); }
.input-bar { display: flex; align-items: flex-end; gap: 12px; max-width: 860px; margin: 0 auto; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px 10px 14px; }
.input { flex: 1; background: transparent; border: none; resize: none; outline: none; color: var(--text); font-size: 14.5px; min-height: 22px; max-height: 160px; }
.btn-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; cursor: pointer; }
.chat-actions { max-width: 860px; width: 100%; margin: 0 auto; display: none; justify-content: flex-end; padding: 0 0 6px; }
.copy-latest-btn { border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text); border-radius: 10px; padding: 9px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.welcome-placeholder { margin: auto; max-width: 490px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 18px; padding: 28px 24px; text-align: center; color: var(--muted); }
.dots-btn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.dropdown-menu { position: absolute; right: 0; top: 46px; min-width: 180px; background: var(--sidebar); border: 1px solid var(--border); border-radius: 12px; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.2s ease; z-index: 1000; }
.dropdown-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
.dropdown-menu div { padding: 11px 14px; font-size: 13px; cursor: pointer; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(2,6,23,0.42); backdrop-filter: blur(4px); z-index: 900; }
.overlay.show { display: block; }
@media print { @page { size: A4 portrait; margin: 25.4mm; }.sidebar,.topbar,.input-container { display: none!important; }.main { margin-left: 0; width: 100%; }.a4-page { border: none; page-break-after: always; } }
@media (max-width: 900px) {.sidebar { transform: translateX(-100%); }.sidebar.open { transform: translateX(0); }.main { width: 100%; margin-left: 0; }.a4-page { width: 95vw; height: auto; min-height: 1123px; } }
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
  <div class="logo"><div class="logo-dot"></div>Tempaper</div>
  <div class="menu-item active" id="newChatBtn"><div class="menu-left">+ New Project</div></div>
  <div class="menu-item" id="historyToggle"><div class="menu-left">Recent Papers</div><span id="historyArrow">❯</span></div>
  <div class="submenu" id="historySubmenu"></div>
  <div class="sidebar-bottom"><div class="profile-box"><div class="profile-avatar" id="profileAvatar">G</div><div><div id="profileName">Guest</div><div id="profileEmail" style="font-size:11px;color:var(--muted)">guest@tempaper.com</div></div></div></div>
</div>
<div class="main">
  <div class="topbar"><div>Academic Editor</div><div style="position:relative"><button class="dots-btn" id="dotsBtn">⋯</button><div class="dropdown-menu" id="dotsMenu"><div id="menuNewChat">New Workspace</div></div></div></div>
  <div class="chat-area" id="chatArea"><div class="welcome-placeholder" id="welcomeMsg"><h2>Academic Paper Generator</h2>Enter your topic below</div></div>
  <div class="chat-actions" id="chatActions"><button class="copy-latest-btn" id="copyLatestBtn">Copy</button></div>
  <div class="input-container"><div class="input-bar"><textarea class="input" id="promptInput" rows="1" placeholder="Write a research paper on..."></textarea><div><button class="btn-icon" id="sendBtn">➤</button></div></div></div>
</div>
<script>
const API_URL = "https://term-paper-n4kl.onrender.com";
let isGenerating = false; let latestResultText = ""; let activeChatHistory = []; let currentUser = null;

function cleanPaperText(text){
  if(!text) return "";
  return text
   .replace(/^\s*\.{2,}\s*$/gm,'')
   .replace(/^\s*\-{3,}\s*$/gm,'')
   .replace(/^\s*\*{3,}\s*$/gm,'')
   .replace(/^\s*\d{1,3}\s*$/gm,'')
   .replace(/(\w+)-\s*\n\s*(\w+)/g,'$1$2')
   .replace(/(\w+)-\s+(\w+)/g,'$1$2')
   .replace(/\*\*(\d+\.?\d*\s+[^\*]+)\*\*/g,'### $1')
   .replace(/\n{3,}/g,'\n\n')
   .trim();
}

function markdownToHTML(markdown){
  if(!markdown) return "";
  let html = markdown.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const lines = html.split(/\r?\n/); const out=[]; let listBuffer=null;
  function flushList(){ if(!listBuffer) return; out.push(`<${listBuffer.type}>`); listBuffer.items.forEach(li=>out.push(`<li>${li}</li>`)); out.push(`</${listBuffer.type}>`); listBuffer=null; }
  for(let line of lines){
    if(/^###\s+(.*)/.test(line)){ flushList(); out.push(`<h3>${line.match(/^###\s+(.*)/)[1].trim()}</h3>`); continue; }
    if(/^##\s+(.*)/.test(line)){ flushList(); out.push(`<h2>${line.match(/^##\s+(.*)/)[1].trim()}</h2>`); continue; }
    if(/^#\s+(.*)/.test(line)){ flushList(); out.push(`<h1>${line.match(/^#\s+(.*)/)[1].trim()}</h1>`); continue; }
    if(/^\d+\.\s+(.*)/.test(line)){ const m=line.match(/^\d+\.\s+(.*)/); if(!listBuffer||listBuffer.type!=='ol'){flushList(); listBuffer={type:'ol',items:[]};} listBuffer.items.push(m[1].trim()); continue; }
    if(/^[\*\-\+]\s+(.*)/.test(line)){ const m=line.match(/^[\*\-\+]\s+(.*)/); if(!listBuffer||listBuffer.type!=='ul'){flushList(); listBuffer={type:'ul',items:[]};} listBuffer.items.push(m[1].trim()); continue; }
    if(/^\s*$/.test(line)){ flushList(); out.push(''); continue; }
    let processed = line.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>").replace(/`(.*?)`/g,"<code>$1</code>");
    out.push(processed);
  }
  flushList();
  const blocks=[]; let paraBuffer=[];
  function flushPara(){ if(!paraBuffer.length) return; const t=paraBuffer.join("\n").trim(); if(t) blocks.push(`<p>${t}</p>`); paraBuffer=[]; }
  for(const token of out){
    if(!token){ flushPara(); continue; }
    if(/^<(h1|h2|h3|ul|ol|blockquote|li|\/ul|\/ol)/i.test(token)){ flushPara(); blocks.push(token); continue; }
    paraBuffer.push(token);
  }
  flushPara(); return blocks.join("\n");
}

function paginateContent(html){
  const measureWrapper=document.createElement('div');
  measureWrapper.style.position='absolute'; measureWrapper.style.left='-99999px'; measureWrapper.style.top='-99999px';
  document.body.appendChild(measureWrapper);
  const measurePage=document.createElement('div');
  measurePage.style.width='calc(210mm - 50.8mm)'; measurePage.style.boxSizing='border-box';
  measurePage.style.fontFamily='"Times New Roman", Times, serif'; measurePage.style.fontSize='12pt'; measurePage.style.lineHeight='2.0';
  const measureBody=document.createElement('div'); measureBody.style.height='calc(297mm - 50.8mm - 22mm)'; measureBody.style.overflow='hidden';
  const measureContent=document.createElement('div'); measureContent.style.width='100%';
  measureContent.style.fontFamily='"Times New Roman", Times, serif'; measureContent.style.fontSize='12pt'; measureContent.style.lineHeight='2.0';
  measureBody.appendChild(measureContent); measurePage.appendChild(measureBody); measureWrapper.appendChild(measurePage);
  const temp=document.createElement('div'); temp.innerHTML=html; const blocks=Array.from(temp.childNodes).map(n=>n.cloneNode(true));
  const pages=[]; measureContent.innerHTML='';
  function fits(){ return measureContent.scrollHeight <= measureBody.clientHeight + 0.5; }
  function testAppend(node){ measureContent.appendChild(node); const ok=fits(); if(!ok) measureContent.removeChild(node); return ok; }
  for(let i=0;i<blocks.length;i++){
    let node=blocks[i]; if(node.nodeType===3){ if(!node.textContent.trim()) continue; const p=document.createElement('p'); p.innerHTML=node.textContent.trim(); node=p; }
    const clone=node.cloneNode(true);
    if(testAppend(clone.cloneNode(true))){ measureContent.appendChild(clone); continue; }
    if(measureContent.childNodes.length>0){ pages.push(Array.from(measureContent.childNodes).map(n=>n.cloneNode(true))); measureContent.innerHTML=''; }
    if(testAppend(clone.cloneNode(true))){ measureContent.appendChild(clone); continue; }
    const text=clone.textContent||''; const words=text.split(/\s+/); let w=0;
    while(w<words.length){
      const testP=document.createElement('p'); testP.textContent=words[w];
      if(testAppend(testP.cloneNode(true))){ measureContent.appendChild(testP); w++; } else {
        if(measureContent.childNodes.length===0){ const forced=document.createElement('p'); forced.textContent=words[w]; measureContent.appendChild(forced); w++; }
        else { pages.push(Array.from(measureContent.childNodes).map(n=>n.cloneNode(true))); measureContent.innerHTML=''; }
      }
    }
  }
  if(measureContent.childNodes.length>0){ pages.push(Array.from(measureContent.childNodes).map(n=>n.cloneNode(true))); }
  const pagesHTML=pages.map(pn=>{ const w=document.createElement('div'); pn.forEach(n=>w.appendChild(n.cloneNode(true))); return w.innerHTML; });
  document.body.removeChild(measureWrapper); return pagesHTML;
}

function createA4Pages(htmlContent,totalWords){
  const pageBodies=paginateContent(htmlContent); const totalPages=pageBodies.length||1;
  let pagesHTML=`<div class="document-stats"><div><strong>${totalPages}</strong> Pages • <strong>${totalWords}</strong> Words</div><div><button class="copy-latest-btn" onclick="navigator.clipboard.writeText(latestResultText)">Copy All</button></div></div><div class="pages-container">`;
  pageBodies.forEach((bodyHtml,idx)=>{
    pagesHTML+=`<div class="a4-page"><div class="a4-inner"><div class="a4-header">Tempaper</div><div class="a4-body"><div class="a4-content">${bodyHtml}</div></div><div class="a4-footer"><span>${idx+1}</span></div></div></div>`;
  });
  pagesHTML+=`</div>`; return pagesHTML;
}

document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("sendBtn").onclick=generatePaper;
  document.getElementById("promptInput").onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); generatePaper(); } };
  document.getElementById("newChatBtn").onclick=()=>{ document.getElementById("chatArea").innerHTML='<div class="welcome-placeholder">Academic Paper Generator</div>'; latestResultText=""; };
  document.getElementById("copyLatestBtn").onclick=async()=>{ if(latestResultText){ await navigator.clipboard.writeText(latestResultText); document.getElementById("copyLatestBtn").textContent="Copied!"; setTimeout(()=>document.getElementById("copyLatestBtn").textContent="Copy",1500); } };
  document.getElementById("dotsBtn").onclick=e=>{ e.stopPropagation(); document.getElementById("dotsMenu").classList.toggle("show"); };
});

async function generatePaper(){
  if(isGenerating) return;
  const input=document.getElementById("promptInput"); const prompt=input.value.trim(); if(!prompt) return;
  isGenerating=true; document.getElementById("sendBtn").disabled=true;
  addMessage("user",prompt); input.value="";
  addLoadingMessage();
  try{
    const res=await fetch(`${API_URL}/generate`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:prompt,user_id:"guest"})});
    const data=await res.json();
    if(res.ok&&data.result){
      const cleaned=cleanPaperText(data.result);
      const wordCount=cleaned.split(/\s+/).length;
      const htmlContent=markdownToHTML(cleaned);
      const paginatedHTML=createA4Pages(htmlContent,wordCount);
      removeLoadingMessage(); addMessage("paper",paginatedHTML);
      latestResultText=cleaned; document.getElementById("chatActions").style.display="flex";
    }else{ removeLoadingMessage(); addMessage("error",data.error||"Failed"); }
  }catch(e){ removeLoadingMessage(); addMessage("error","Network error"); }
  finally{ isGenerating=false; document.getElementById("sendBtn").disabled=false; }
}
function addLoadingMessage(){ const chatArea=document.getElementById("chatArea"); const welcome=document.getElementById("welcomeMsg"); if(welcome) welcome.remove(); const c=document.createElement("div"); c.id="loadingMessage"; c.className="chat-msg"; c.innerHTML=`<div class="loading-container"><div class="dot-loader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div>Generating your paper...</div></div>`; chatArea.appendChild(c); chatArea.scrollTop=chatArea.scrollHeight; }
function removeLoadingMessage(){ const l=document.getElementById("loadingMessage"); if(l) l.remove(); }
function addMessage(role,content){ const chatArea=document.getElementById("chatArea"); const welcome=document.getElementById("welcomeMsg"); if(welcome) welcome.remove(); const container=document.createElement("div"); container.className=role==="user"?"chat-msg user":"chat-msg"; if(role==="user") container.innerText=content; else container.innerHTML=content; chatArea.appendChild(container); chatArea.scrollTop=chatArea.scrollHeight; }
</script>
</body>
</html>
