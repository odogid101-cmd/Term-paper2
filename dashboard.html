<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempaper - Academic Writer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f5f5f7;color:#111}
header{background:#111;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:18px}
#main{max-width:900px;margin:30px auto;padding:0 16px}
textarea{width:100%;min-height:140px;padding:14px;border-radius:12px;border:1px solid #ddd;font-size:15px;resize:vertical}
button{padding:12px 20px;border-radius:10px;border:none;background:#111;color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:0.5}
#controls{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
#info{font-size:13px;color:#666;margin:10px 0}

/* 3 DOT ANIMATION - replaces Searching... */
.dots-loader{display:none;gap:8px;justify-content:center;align-items:center;padding:40px 0}
.dots-loader.active{display:flex}
.dots-loader span{width:12px;height:12px;background:#111;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
.dots-loader span:nth-child(1){animation-delay:-0.32s}
.dots-loader span:nth-child(2){animation-delay:-0.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0);opacity:0.5}40%{transform:scale(1);opacity:1}}

/* A4 PAGES */
.tempaper-wrapper{background:#525659;padding:20px;display:flex;flex-direction:column;align-items:center;border-radius:12px;min-height:200px}
.a4-page{width:210mm;max-width:100%;min-height:297mm;background:white;padding:25mm 20mm 20mm 20mm;margin:0 0 20px 0;box-shadow:0 4px 30px rgba(0,0,0,0.3);position:relative;font-family:'Merriweather',serif;color:#111;line-height:1.7;box-sizing:border-box}
.a4-page h1{font-size:22pt;text-align:center;margin-bottom:20px;font-weight:700;line-height:1.2}
.a4-page h2{font-size:14pt;font-weight:700;margin-top:26px;margin-bottom:10px;border-bottom:1px solid #ddd;padding-bottom:6px}
.a4-page h3{font-size:12pt;font-weight:700;margin-top:20px;margin-bottom:8px}
.a4-page p{font-size:11pt;text-align:justify;margin-bottom:12px}
.a4-page ul,.a4-page ol{font-size:11pt;margin-left:22px;margin-bottom:12px}
.a4-page li{margin-bottom:6px}
.a4-page .page-number{position:absolute;bottom:12mm;left:0;right:0;text-align:center;font-size:9pt;color:#888;font-family:Inter,sans-serif}

@media(max-width:800px){.a4-page{padding:15mm 12mm;width:100%;min-height:auto}}
@media print{.tempaper-wrapper{background:white;padding:0}.a4-page{box-shadow:none;margin:0;page-break-after:always}header,#main>textarea,#controls,#info{display:none}}
</style>
</head>
<body>
<header>
<h1>Tempaper</h1>
<div>
<button id="printBtn" style="background:white;color:#111;display:none" onclick="window.print()">Print / Save PDF</button>
</div>
</header>

<div id="main">
<textarea id="prompt" placeholder="Enter your term paper topic... e.g. The impact of AI on education in Africa"></textarea>
<div id="controls">
<button id="genBtn" onclick="generate()">Generate Paper</button>
<span id="info"></span>
</div>

<div class="dots-loader" id="loader"><span></span><span></span><span></span></div>

<div id="paper"></div>
</div>

<script>
const API = "https://term-paper-n4kl.onrender.com"; // <-- CHANGE THIS TO YOUR RENDER URL

function markdownToBlocks(md){
    const lines = md.split('\n');
    let blocks = [];
    let inUl = false, inOl = false;
    const inline = (t)=>{
        return t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
                .replace(/\*(.*?)\*/g,'<em>$1</em>')
                .replace(/`(.*?)`/g,'<code>$1</code>');
    };
    for(let line of lines){
        let s = line.trim();
        if(!s){
            if(inUl){blocks.push('</ul>'); inUl=false}
            if(inOl){blocks.push('</ol>'); inOl=false}
            continue;
        }
        if(s.startsWith('# ')){
            if(inUl){blocks.push('</ul>'); inUl=false}
            if(inOl){blocks.push('</ol>'); inOl=false}
            blocks.push(`<h1>${inline(s.slice(2))}</h1>`);
        } else if(s.startsWith('## ')){
            if(inUl){blocks.push('</ul>'); inUl=false}
            if(inOl){blocks.push('</ol>'); inOl=false}
            blocks.push(`<h2>${inline(s.slice(3))}</h2>`);
        } else if(s.startsWith('### ')){
            if(inUl){blocks.push('</ul>'); inUl=false}
            if(inOl){blocks.push('</ol>'); inOl=false}
            blocks.push(`<h3>${inline(s.slice(4))}</h3>`);
        } else if(/^[-*]\s+/.test(s)){
            if(inOl){blocks.push('</ol>'); inOl=false}
            if(!inUl){blocks.push('<ul>'); inUl=true}
            blocks.push(`<li>${inline(s.replace(/^[-*]\s+/,''))}</li>`);
        } else if(/^\d+\.\s+/.test(s)){
            if(inUl){blocks.push('</ul>'); inUl=false}
            if(!inOl){blocks.push('<ol>'); inOl=true}
            blocks.push(`<li>${inline(s.replace(/^\d+\.\s+/ ,''))}</li>`);
        } else {
            if(inUl){blocks.push('</ul>'); inUl=false}
            if(inOl){blocks.push('</ol>'); inOl=false}
            blocks.push(`<p>${inline(s)}</p>`);
        }
    }
    if(inUl) blocks.push('</ul>');
    if(inOl) blocks.push('</ol>');
    return blocks;
}

function blocksToA4Pages(blocks){
    let pages = [];
    let cur = "";
    for(let b of blocks){
        if((cur.length + b.length) > 3500 && cur){
            pages.push(cur);
            cur = b;
        } else {
            cur += b + "\n";
        }
    }
    if(cur) pages.push(cur);
    
    let html = `<div class="tempaper-wrapper">`;
    pages.forEach((content,i)=>{
        html += `<div class="a4-page"><div>${content}</div><div class="page-number">Page ${i+1} of ${pages.length}</div></div>`;
    });
    html += `</div>`;
    return {html, count: pages.length};
}

async function generate(){
    const prompt = document.getElementById('prompt').value.trim();
    if(!prompt) return alert('Enter a topic');
    
    const btn = document.getElementById('genBtn');
    const loader = document.getElementById('loader');
    const paperDiv = document.getElementById('paper');
    const info = document.getElementById('info');
    
    btn.disabled = true;
    loader.classList.add('active');
    paperDiv.innerHTML = '';
    info.textContent = '';
    document.getElementById('printBtn').style.display='none';

    try{
        const res = await fetch(`${API}/generate`,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({prompt})
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Failed');

        // If your backend already sends result_html (from previous version), use it
        if(data.result_html){
            paperDiv.innerHTML = data.result_html;
            info.textContent = `${data.page_count} A4 pages generated`;
        } else {
            // Frontend A4 conversion - works with old backend too
            const raw = data.result || data.text || '';
            const blocks = markdownToBlocks(raw);
            const {html, count} = blocksToA4Pages(blocks);
            paperDiv.innerHTML = html;
            info.textContent = `${count} A4 pages • ${raw.split(' ').length} words`;
        }
        document.getElementById('printBtn').style.display='inline-block';
        
    }catch(e){
        alert(e.message);
        info.textContent = e.message;
    }finally{
        btn.disabled = false;
        loader.classList.remove('active');
    }
}
</script>
</body>
</html>
