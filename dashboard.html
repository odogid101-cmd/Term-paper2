<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tempaper Generator | Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
:root {
  --bg: #0b0d1a;
  --sidebar: #0f1222;
  --card: #161b33;
  --card-hover: #1f2647;
  --accent: #6366f1;
  --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  --text: #f8fafc;
  --muted: #94a3b8;
  --border: rgba(255, 255, 255, 0.08);
  --danger: #ef4444;
  --sidebar-width: 260px;
  --topbar-height: 64px;
}

[data-theme="light"] {
  --bg: #f8fafc;
  --sidebar: #ffffff;
  --card: #f1f5f9;
  --card-hover: #e2e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --border: rgba(0, 0, 0, 0.08);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  height: 100dvh; /* Adapts nicely to mobile browser bars */
  width: 100vw;
  overflow: hidden;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 4px;
}

/* --- SIDEBAR --- */
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar);
  padding: 20px 16px;
  height: 100vh;
  height: 100dvh;
  position: fixed;
  left: 0;
  top: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1000;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 18px;
  margin-bottom: 24px;
  letter-spacing: -0.02em;
}

.logo-dot {
  width: 32px;
  height: 32px;
  background: var(--accent-gradient);
  border-radius: 10px;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
}

.menu-section-title {
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  margin: 16px 8px 8px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.menu-item {
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  margin-bottom: 4px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s ease;
}

.menu-item:hover, .menu-item.active {
  background: var(--card);
  color: var(--text);
}

.menu-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.submenu {
  display: none;
  padding-left: 12px;
  max-height: 250px;
  overflow-y: auto;
  margin-bottom: 8px;
}

.submenu.show {
  display: block;
}

.submenu-item {
  padding: 8px 12px;
  border-radius: 8px;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.2s;
}

.submenu-item:hover {
  background: var(--card);
  color: var(--text);
}

.sidebar-bottom {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.profile-box {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  cursor: pointer;
  border-radius: 10px;
  transition: background 0.2s;
}

.profile-box:hover {
  background: var(--card);
}

.profile-avatar {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--accent-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  color: white;
  flex-shrink: 0;
}

.profile-info {
  overflow: hidden;
}

.profile-info .name {
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.profile-info .email {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* --- MAIN CONTAINER --- */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  margin-left: var(--sidebar-width);
  height: 100vh;
  height: 100dvh;
  width: calc(100% - var(--sidebar-width));
  transition: margin-left 0.3s;
  overflow: hidden;
}

/* Topbar */
.topbar {
  height: var(--topbar-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(11, 13, 26, 0.7);
  backdrop-filter: blur(12px);
  flex-shrink: 0;
}

.nav-toggle {
  display: none;
}

.icon-btn {
  background: none;
  border: none;
  color: var(--text);
  cursor: pointer;
  padding: 8px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.icon-btn:hover {
  background: var(--card);
}

.top-actions {
  position: relative;
}

.dots-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  width: 38px;
  height: 38px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.dots-btn:hover {
  background: var(--card-hover);
}
.dropdown-menu {
  position: absolute;
  right: 0;
  bottom: 48px; /* CHANGED: top -> bottom */
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  min-width: 170px;
  box-shadow: 0 -10px 25px rgba(0,0,0,0.3); /* CHANGED: shadow goes up */
  opacity: 0;
  visibility: hidden;
  transform: translateY(8px); /* CHANGED: -8px -> 8px so it slides up */
  transition: all 0.2s ease;
  z-index: 200;
  overflow: hidden;
}

.dropdown-menu.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.dropdown-menu div {
  padding: 12px 16px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text);
  transition: background 0.2s;
}

.dropdown-menu div:hover {
  background: var(--card-hover);
}

.dropdown-menu .danger {
  color: var(--danger);
}

/* Chat Area - Scrollable & Flexible Height */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px 30px; /* Extra bottom padding so messages don't stick to the input bar */
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 850px;
  width: 100%;
  margin: 0 auto;
  scroll-behavior: smooth;
}

.chat-msg {
  padding: 14px 18px;
  border-radius: 16px;
  max-width: 82%;
  border: 1px solid var(--border);
  position: relative;
  line-height: 1.6;
  font-size: 15px;
  animation: fadeIn 0.3s ease;
  word-break: break-word;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.chat-msg.user {
  align-self: flex-end;
  background: var(--accent-gradient);
  color: white;
  border: none;
  border-bottom-right-radius: 4px;
}

.chat-msg.ai {
  align-self: flex-start;
  background: var(--card);
  border-bottom-left-radius: 4px;
  padding-right: 48px;
}

.speak-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  padding: 4px;
  transition: color 0.2s;
}

.speak-btn:hover {
  color: var(--text);
}

/* Input Area - Lifted Up with Padding Below */
.input-container {
  padding: 12px 24px 28px; /* Extra bottom padding lifts input bar up */
  background: var(--bg);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.input-bar {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 8px 12px 8px 16px;
  max-width: 850px;
  margin: 0 auto;
  transition: border-color 0.2s;
}

.input-bar:focus-within {
  border-color: var(--accent);
}

.input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 15px;
  resize: none;
  max-height: 120px;
  outline: none;
  padding: 6px 0;
  line-height: 1.4;
}

.input::placeholder {
  color: var(--muted);
}

.btn-icon {
  background: var(--accent-gradient);
  color: white;
  border: none;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
}

.btn-icon:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  box-shadow: none;
}

.btn-icon.recording {
  background: var(--danger);
  animation: pulse 1.2s infinite;
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

.welcome-placeholder {
  text-align: center;
  color: var(--muted);
  margin: auto;
  font-size: 16px;
}

.overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  z-index: 900;
  opacity: 0;
  transition: opacity 0.3s ease;
}

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .overlay.show { display: block; opacity: 1; }
  .main { margin-left: 0; width: 100%; }
  .nav-toggle { display: flex; }
  .topbar { padding: 0 16px; }
  .chat-area { padding: 16px 16px 24px; }
  .chat-msg { max-width: 90%; }
  .input-container { padding: 10px 16px 24px; } /* Clean lifted position on mobile */
}
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">
  <div class="logo">
    <div class="logo-dot"></div>
    Tempaper
  </div>

  <div class="menu-section-title">Navigation</div>
  
  <div class="menu-item" id="newChatBtn">
    <div class="menu-left">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New Tempaper
    </div>
  </div>

  <div class="menu-item" id="historyToggle">
    <div class="menu-left">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      History
    </div>
    <span id="historyArrow" style="font-size:12px;">❯</span>
  </div>
  <div class="submenu" id="historySubmenu"></div>

  <div class="menu-item" onclick="window.location='settings.html'">
    <div class="menu-left">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
      Settings
    </div>
  </div>

  <div class="sidebar-bottom">
    <div class="profile-box" onclick="window.location='settings.html'">
      <div class="profile-avatar" id="profileAvatar">G</div>
      <div class="profile-info">
        <div class="name" id="profileName">Guest User</div>
        <div class="email" id="profileEmail">guest@tempaper.com</div>
      </div>
    </div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="Toggle Navigation">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    
    <div style="font-weight: 600; font-size: 16px;">Dashboard</div>

    <div class="top-actions">
      <button class="dots-btn" id="dotsBtn" aria-label="More options">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
      <div class="dropdown-menu" id="dotsMenu">
        <div id="menuNewChat">New Chat</div>
        <div onclick="window.location='settings.html'">Profile</div>
        <div class="danger" onclick="logout()">Logout</div>
      </div>
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome-placeholder" id="welcomeMsg">What topic do you want to explore today?</div>
  </div>

  <div class="input-container">
    <div class="input-bar">
      <textarea class="input" id="promptInput" rows="1" placeholder="Ask Tempaper anything or tap mic to speak..."></textarea>
      <button class="btn-icon" id="sendBtn" aria-label="Send or Record">
        <svg id="micIcon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
        <svg id="sendIcon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://term-paper-n4kl.onrender.com";
let currentUser = null;
let appSettings = {theme: 'system', fontSize: 16, notifications: true};
let isGenerating = false;
let touchStartX = 0;
let recognition = null;
let isRecording = false;
let activeChatHistory = [];

document.addEventListener("DOMContentLoaded", async () => {
  loadAppSettings();

  // Ensure user_id exists or set fallback
  let userId = localStorage.getItem("user_id");
  if (!userId) {
    userId = "demo_user";
    localStorage.setItem("user_id", userId);
  }

  // Load profile with timeout to prevent hanging
  await loadProfile(userId);
  loadChats();

  // Event handlers
  document.getElementById("sendBtn").onclick = handleSendOrRecord;
  document.getElementById("promptInput").oninput = handleInputChange;
  document.getElementById("promptInput").onkeydown = (e) => { 
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); generatePaper(); } 
  };
  document.getElementById("navToggle").onclick = toggleSidebar;
  document.getElementById("overlay").onclick = toggleSidebar;
  document.getElementById("dotsBtn").onclick = (e) => { 
    e.stopPropagation(); 
    document.getElementById("dotsMenu").classList.toggle("show"); 
  };
  document.getElementById("historyToggle").onclick = toggleHistory;
  document.getElementById("newChatBtn").onclick = startNewChat;
  document.getElementById("menuNewChat").onclick = () => { startNewChat(); closeDots(); };
  
  document.addEventListener("click", (e) => { if (!e.target.closest('.top-actions')) closeDots(); });
  document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
  document.addEventListener('touchend', e => {
    if (touchStartX > 50 && e.changedTouches[0].screenX < touchStartX - 50) {
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("overlay").classList.remove("show");
    }
  });
  autoResizeTextarea();
});

function handleSendOrRecord() {
  const input = document.getElementById("promptInput");
  if (input.value.trim().length > 0) {
    generatePaper();
  } else {
    toggleRecording();
  }
}

function toggleRecording() {
  const btn = document.getElementById("sendBtn");
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice recognition is not supported on this browser.");
    return;
  }

  if (isRecording) {
    if (recognition) recognition.stop();
    isRecording = false;
    btn.classList.remove("recording");
    return;
  }

  try {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
      isRecording = true;
      btn.classList.add("recording");
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      document.getElementById("promptInput").value = transcript;
      handleInputChange();
      autoResizeTextarea();
    };

    recognition.onerror = (e) => {
      alert("Voice error: " + e.error);
      isRecording = false;
      btn.classList.remove("recording");
    };

    recognition.onend = () => {
      isRecording = false;
      btn.classList.remove("recording");
    };

    recognition.start();
  } catch (err) {
    alert("Microphone permission or browser issue: " + err.message);
    isRecording = false;
    btn.classList.remove("recording");
  }
}

function closeDots() { document.getElementById("dotsMenu").classList.remove("show"); }
function toggleSidebar() { document.getElementById("sidebar").classList.toggle("open"); document.getElementById("overlay").classList.toggle("show"); }
function loadAppSettings() { const saved = localStorage.getItem("app_settings"); if (saved) appSettings = JSON.parse(saved); applyTheme(); document.documentElement.style.setProperty('--font-size', appSettings.fontSize + 'px'); }
function applyTheme() { if (appSettings.theme === 'system') { const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light'); } else { document.documentElement.setAttribute('data-theme', appSettings.theme); } }

async function loadProfile(userId) {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 6000);

    const res = await fetch(`${API_URL}/me?user_id=${userId}`, { signal: controller.signal });
    clearTimeout(timeoutId);

    if (res.ok) {
      const data = await res.json();
      if (data.user) {
        currentUser = data.user;
        currentUser.id = currentUser.id || currentUser.user_id;
        const name = currentUser.username || currentUser.email.split('@')[0];
        document.getElementById("profileAvatar").innerText = name[0].toUpperCase();
        document.getElementById("profileName").innerText = name;
        document.getElementById("profileEmail").innerText = currentUser.email;
        return true;
      }
    }
  } catch(e) { 
    console.warn("Backend slow or unreachable, using fallback profile info:", e); 
  }

  // Fallback info if offline or Render is waking up
  document.getElementById("profileAvatar").innerText = "G";
  document.getElementById("profileName").innerText = "Guest User";
  document.getElementById("profileEmail").innerText = "guest@tempaper.com";
  return true;
}

function handleInputChange() {
  const input = document.getElementById("promptInput");
  const micIcon = document.getElementById("micIcon");
  const sendIcon = document.getElementById("sendIcon");
  
  if (input.value.trim().length > 0) {
    micIcon.style.display = "none";
    sendIcon.style.display = "block";
  } else {
    micIcon.style.display = "block";
    sendIcon.style.display = "none";
  }
  autoResizeTextarea();
}

function autoResizeTextarea() {
  const textarea = document.getElementById("promptInput");
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
}

function startNewChat() { 
  document.getElementById("chatArea").innerHTML = `<div class="welcome-placeholder" id="welcomeMsg">What topic do you want to explore today?</div>`; 
  document.getElementById("promptInput").value = ""; 
  activeChatHistory = [];
  handleInputChange(); 
}

async function generatePaper() {
  if (isGenerating) return;
  const input = document.getElementById("promptInput");
  const prompt = input.value.trim();
  if (!prompt) return;

  isGenerating = true;
  document.getElementById("sendBtn").disabled = true;

  addMessage("user", prompt);
  input.value = "";
  handleInputChange();

  addMessage("ai", "Generating response...", true);

  setTimeout(() => {
    const fakeResult = `Result for: "${prompt}"\n\nThis response appears right below your message and keeps appending as you type continuous prompts.`;
    updateLastAiMessage(fakeResult);
    
    activeChatHistory.push({ prompt, result: fakeResult });
    saveChatSession();
    
    isGenerating = false;
    document.getElementById("sendBtn").disabled = false;
  }, 1500);
}

function addMessage(role, text, isTemp = false) {
  const chatArea = document.getElementById("chatArea");
  
  const welcomeMsg = document.getElementById("welcomeMsg");
  if (welcomeMsg) welcomeMsg.remove();

  const div = document.createElement("div");
  div.className = `chat-msg ${role}`;
  div.style.whiteSpace = "pre-wrap";
  div.innerText = text;

  if (role === "ai") {
    const speakBtn = document.createElement("button");
    speakBtn.className = "speak-btn";
    speakBtn.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>`;
    speakBtn.onclick = () => speakText(text);
    div.appendChild(speakBtn);
  }

  if (isTemp) div.id = "tempAiMsg";
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function updateLastAiMessage(text) { 
  const temp = document.getElementById("tempAiMsg"); 
  if (temp) { 
    temp.innerText = text; 
    const speakBtn = document.createElement("button"); 
    speakBtn.className = "speak-btn"; 
    speakBtn.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>`; 
    speakBtn.onclick = () => speakText(text); 
    temp.appendChild(speakBtn); 
    temp.removeAttribute("id"); 
  } 
  const chatArea = document.getElementById("chatArea");
  chatArea.scrollTop = chatArea.scrollHeight;
}

function speakText(text) { 
  if ('speechSynthesis' in window) { 
    window.speechSynthesis.cancel(); 
    const utter = new SpeechSynthesisUtterance(text); 
    utter.lang = 'en-US'; 
    window.speechSynthesis.speak(utter); 
  } else { 
    alert("Speech synthesis is not supported on this browser."); 
  } 
}

function getChatKey() { return "chats_" + (currentUser?.id || "guest"); }

function saveChatSession() { 
  if (activeChatHistory.length === 0) return;
  let chats = JSON.parse(localStorage.getItem(getChatKey()) || "[]"); 
  
  const firstPrompt = activeChatHistory[0].prompt;
  const existingIdx = chats.findIndex(c => c.id === activeChatHistory[0].id);

  const sessionData = {
    id: activeChatHistory[0].id || Date.now(),
    title: firstPrompt,
    messages: activeChatHistory,
    time: Date.now()
  };
  activeChatHistory[0].id = sessionData.id;

  if (existingIdx !== -1) {
    chats[existingIdx] = sessionData;
  } else {
    chats.unshift(sessionData);
  }

  localStorage.setItem(getChatKey(), JSON.stringify(chats.slice(0, 20))); 
  loadChats(); 
}

function loadChats() { 
  let chats = JSON.parse(localStorage.getItem(getChatKey()) || "[]"); 
  const submenu = document.getElementById("historySubmenu"); 
  if (chats.length) { 
    submenu.innerHTML = chats.map((c, i) => `<div class="submenu-item" onclick="openChatSession(${i})"><b>${(c.title || c.prompt || "Chat").substring(0,28)}...</b></div>`).join(""); 
  } else { 
    submenu.innerHTML = `<div class="submenu-item" style="color:var(--muted)">No history</div>`; 
  } 
}

function openChatSession(index) { 
  let chats = JSON.parse(localStorage.getItem(getChatKey()) || "[]"); 
  const session = chats[index]; 
  document.getElementById("chatArea").innerHTML = ""; 
  
  if (session.messages && session.messages.length) {
    activeChatHistory = session.messages;
    session.messages.forEach(m => {
      addMessage("user", m.prompt);
      addMessage("ai", m.result);
    });
  } else if (session.prompt) {
    activeChatHistory = [{ prompt: session.prompt, result: session.result }];
    addMessage("user", session.prompt);
    addMessage("ai", session.result);
  }
  
  toggleHistory(); 
}

function toggleHistory() { 
  document.getElementById("historySubmenu").classList.toggle("show"); 
}

function logout() { localStorage.removeItem("user_id"); window.location.href="setup-signin.html"; }
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
</script>
