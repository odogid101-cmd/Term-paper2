<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sponsored — Monkey Scout</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0f1f19;
      color: #e8f3ee;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 90px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      margin: 0 0 18px;
      max-width: 420px;
      color: #b7c9c1;
      font-size: 14px;
      line-height: 1.5;
    }
    .close-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      background: rgba(8, 18, 14, 0.92);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: center;
      z-index: 2147483647;
    }
    button.close {
      width: min(320px, 100%);
      padding: 14px 18px;
      border: 0;
      border-radius: 12px;
      background: #1f8a62;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button.close:active { background: #176b4c; }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #8aa399;
    }
  </style>
</head>
<body>
  <div class="stage">
    <h1>Sponsored</h1>
    <p>A sponsored page may open behind this one. When you are ready, press Close to return and start your download.</p>
    <div class="hint">The download continues after you press Close.</div>
  </div>

  <div class="close-bar">
    <button type="button" class="close" id="closeBtn">Close</button>
  </div>

  <!-- Popunder loads after the Close button is ready so the button stays usable -->
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const downloadType = (params.get("type") || "pdf").toLowerCase() === "docx" ? "docx" : "pdf";
      let finished = false;

      function signalDone(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        if (finished) return;
        finished = true;
        const payload = { type: "ms-ad-gate-done", downloadType: downloadType, ts: Date.now() };
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage(payload, "*");
          }
        } catch (_) {}
        try {
          localStorage.setItem("ms_ad_gate_done", JSON.stringify(payload));
        } catch (_) {}
        try { window.close(); } catch (_) {}
        setTimeout(function () {
          try { location.href = "dashboard.html"; } catch (_) {}
        }, 500);
      }

      document.getElementById("closeBtn").addEventListener("click", signalDone, true);

      // Load the popunder after a short delay so the Close button is already wired.
      setTimeout(function () {
        const s = document.createElement("script");
        s.setAttribute("data-cfasync", "false");
        s.src = "https://abscloud.org/1/1c8e6f71a0026b587596c0cc973a3db3";
        document.body.appendChild(s);
      }, 400);
    })();
  </script>
</body>
</html>
