<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monkey Scout Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#202124;font-family:Arial,Helvetica,sans-serif}.top{height:58px;background:#185abd;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px;flex-wrap:wrap}.brand{font-weight:700;font-size:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c7d0dd;border-radius:6px;background:#fff;padding:9px 12px;cursor:pointer;font-weight:600;color:#243247}.btn:hover{background:#edf4ff}.toolbar{position:sticky;top:0;z-index:5;background:white;border-bottom:1px solid #ddd;display:flex;gap:5px;padding:10px;flex-wrap:wrap;box-shadow:0 2px 5px #0001}.toolbar button,.toolbar select{border:1px solid #ddd;border-radius:5px;background:#fff;padding:7px 9px;cursor:pointer}.toolbar button:hover{background:#f0f4fa}.wrap{max-width:1000px;margin:24px auto;padding:0 15px}.paper{background:white;min-height:1100px;padding:80px 95px;box-shadow:0 5px 25px #0001;border:1px solid #e1e5eb;outline:none;line-height:1.7;font-size:16px;color:#222}.paper:focus{outline:none}.status{font-size:12px;color:#dce8ff;margin-left:10px}@media(max-width:700px){.paper{padding:35px 22px;min-height:80vh}.top{height:auto;padding:12px}.wrap{margin:12px auto}}@media print{.top,.toolbar{display:none}.wrap{margin:0;padding:0}.paper{box-shadow:none;border:0;padding:0}}
</style></head><body>
<header class="top"><div class="brand">📘 Monkey Scout — Editor <span class="status" id="status">Ready</span></div><div class="actions"><button class="btn" onclick="saveLocal()">Save</button><button class="btn" onclick="saveToDashboard()">Save to Dashboard</button><button class="btn" onclick="downloadWord()">Save Word</button><button class="btn" onclick="downloadHTML()">Download HTML</button><button class="btn" onclick="downloadText()">Download TXT</button><button class="btn" onclick="window.print()">Print / PDF</button><button class="btn" onclick="window.close(); if(!window.closed) history.back()">Back</button></div></header>
<nav class="toolbar" aria-label="Formatting toolbar"><button onclick="cmd('undo')">↶</button><button onclick="cmd('redo')">↷</button><select onchange="cmd('formatBlock',this.value)"><option value="p">Paragraph</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option></select><select onchange="cmd('fontName',this.value)"><option>Arial</option><option>Times New Roman</option><option>Calibri</option><option>Georgia</option></select><select onchange="cmd('fontSize',this.value)"><option value="3">Normal</option><option value="2">Small</option><option value="4">Large</option><option value="5">Very large</option></select><button onclick="cmd('bold')"><b>B</b></button><button onclick="cmd('italic')"><i>I</i></button><button onclick="cmd('underline')"><u>U</u></button><button onclick="cmd('strikeThrough')">S</button><button onclick="cmd('justifyLeft')">Left</button><button onclick="cmd('justifyCenter')">Center</button><button onclick="cmd('justifyRight')">Right</button><button onclick="cmd('justifyFull')">Justify</button><button onclick="cmd('insertUnorderedList')">• List</button><button onclick="cmd('insertOrderedList')">1. List</button><button onclick="cmd('outdent')">Outdent</button><button onclick="cmd('indent')">Indent</button><button onclick="cmd('insertHorizontalRule')">Rule</button><button onclick="insertLink()">Link</button><button onclick="insertImage()">Image</button><button onclick="clearFormatting()">Clear formatting</button></nav>
<div class="wrap"><article id="paper" class="paper" contenteditable="true" spellcheck="true"></article></div>
<script>
const paper=document.getElementById('paper'),statusEl=document.getElementById('status');let saveTimer;
function setStatus(s){statusEl.textContent=s}
function load(){let d='';try{d=localStorage.getItem('monkeyScoutEditorDoc')||''}catch(e){};paper.innerHTML=d||'<h1>Term Paper</h1><p>Start editing your document here…</p>';setStatus('Ready')}
function cmd(command,value=null){paper.focus();document.execCommand(command,false,value);scheduleSave()}
function insertLink(){let url=prompt('Enter link URL');if(url)cmd('createLink',url)}function insertImage(){let url=prompt('Image URL');if(url)cmd('insertImage',url)}function clearFormatting(){cmd('removeFormat')}
function saveLocal(){try{localStorage.setItem('monkeyScoutEditorDoc',paper.innerHTML);setStatus('Saved locally')}catch(e){setStatus('Could not save')}}function scheduleSave(){setStatus('Editing…');clearTimeout(saveTimer);saveTimer=setTimeout(saveLocal,800)}paper.addEventListener('input',scheduleSave);
function downloadBlob(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadHTML(){downloadBlob('term-paper.html','<!doctype html><meta charset="utf-8"><title>Term Paper</title>'+paper.innerHTML,'text/html')}function downloadText(){downloadBlob('term-paper.txt',paper.innerText,'text/plain')}
function downloadWord(){const html='<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Times New Roman;font-size:12pt;line-height:1.5}img{max-width:100%}</style></head><body>'+paper.innerHTML+'</body></html>';downloadBlob('term-paper.doc',html,'application/msword')}
function saveToDashboard(){saveLocal();try{localStorage.setItem('monkeyScoutEditedDoc',paper.innerHTML);setStatus('Saved to Dashboard — switch back to the dashboard tab')}catch(e){setStatus('Could not sync to dashboard')}}
load();
</script></body></html>
