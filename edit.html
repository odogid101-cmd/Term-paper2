<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Monkey Scout | Paper Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #061a14;
  --panel: rgba(7, 40, 30, 0.96);
  --card: #0a2e22;
  --accent: #087447;
  --accent-2: #065f3a;
  --accent-soft: rgba(8, 116, 71, 0.18);
  --accent-gradient: linear-gradient(135deg, #15945d 0%, #087447 58%, #075c3b 100%);
  --text: #f5fff8;
  --muted: #9bb8ab;
  --border: rgba(148, 200, 170, 0.16);
  --danger: #f87171;
  --success: #34d399;
  --paper: #ffffff;
  --paper-text: #1e293b;
  --toolbar-h: 52px;
  --status-h: 36px;
  --radius: 12px;
  --shadow: 0 16px 40px rgba(2, 30, 20, 0.45);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; }
button {
  border: none;
  background: none;
  color: inherit;
  cursor: pointer;
}
svg { display: block; }

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  width: 100vw;
}

/* ===== Top chrome ===== */
.topbar {
  height: var(--toolbar-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  border-bottom: 1px solid var(--border);
  background: rgba(6, 40, 30, 0.94);
  backdrop-filter: blur(14px);
  z-index: 40;
}
.topbar .brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 14px;
  letter-spacing: -0.03em;
  white-space: nowrap;
}
.brand-dot {
  width: 22px; height: 22px;
  border-radius: 7px;
  background: var(--accent-gradient);
  box-shadow: 0 6px 14px rgba(8,116,71,0.35);
}
.top-title {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.chip-btn {
  min-height: 34px;
  padding: 0 12px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  font-size: 12px;
  font-weight: 650;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background .15s, transform .15s;
}
.chip-btn:hover { background: rgba(255,255,255,0.08); }
.chip-btn.primary {
  background: var(--accent-gradient);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 8px 18px rgba(8,116,71,0.32);
}
.chip-btn.danger { color: var(--danger); }
.chip-btn:disabled { opacity: .55; cursor: wait; }

/* ===== Format toolbar ===== */
.toolbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 10px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  background: rgba(6, 36, 28, 0.96);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  z-index: 30;
}
.toolbar::-webkit-scrollbar { display: none; }
.tb-group {
  display: flex;
  align-items: center;
  gap: 2px;
  padding-right: 6px;
  margin-right: 4px;
  border-right: 1px solid var(--border);
  flex-shrink: 0;
}
.tb-group:last-child { border-right: 0; margin-right: 0; padding-right: 0; }
.tb-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: var(--muted);
  transition: background .12s, color .12s;
}
.tb-btn:hover, .tb-btn.active {
  background: var(--accent-soft);
  color: var(--text);
}
.tb-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.tb-btn b, .tb-btn i, .tb-btn u { font-size: 14px; font-family: Georgia, serif; color: inherit; }
.tb-select {
  min-height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  padding: 0 8px;
  font-size: 12px;
  outline: none;
}
.tb-select option { background: #0f172a; color: #f1f5f9; }

/* ===== Workspace ===== */
.workspace {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 18px 12px 40px;
  background:
    radial-gradient(900px 400px at 10% -10%, rgba(8,116,71,0.16), transparent 55%),
    radial-gradient(700px 300px at 90% 0%, rgba(21,148,93,0.10), transparent 50%),
    var(--bg);
  -webkit-overflow-scrolling: touch;
}

.pages {
  width: min(860px, 100%);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.a4-page {
  position: relative;
  width: 100%;
  min-height: 1056px;
  background: var(--paper);
  color: var(--paper-text);
  padding: 56px 48px 64px;
  border-radius: 4px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(15, 23, 42, 0.06);
  font-family: 'Merriweather', Georgia, serif;
  font-size: 15px;
  line-height: 1.82;
  word-wrap: break-word;
  overflow-wrap: anywhere;
}
.a4-page:focus-within {
  outline: 2px solid rgba(8,116,71,0.40);
  outline-offset: 2px;
}
.a4-content {
  outline: none;
  min-height: 900px;
  text-align: justify;
  color: #334155;
}
.a4-content:empty:before {
  content: attr(data-placeholder);
  color: #94a3b8;
  font-style: italic;
}
.a4-content h1, .a4-content h2, .a4-content h3 {
  font-family: Inter, system-ui, sans-serif;
  color: #0f172a;
  letter-spacing: -0.02em;
  break-after: avoid;
}
.a4-content h1 {
  font-size: 26px; font-weight: 800;
  text-align: center;
  margin: 0 0 20px;
  padding-bottom: 12px;
  border-bottom: 2px solid #e2e8f0;
}
.a4-content h2 { font-size: 18px; font-weight: 700; margin: 22px 0 12px; }
.a4-content h3 { font-size: 15.5px; font-weight: 700; margin: 16px 0 10px; }
.a4-content p { margin: 0 0 12px; }
.a4-content ul, .a4-content ol { margin: 10px 0 12px 24px; }
.a4-content li { margin-bottom: 6px; }
.a4-content strong, .a4-content b { color: #0f172a; }
.a4-content em, .a4-content i { color: #475569; }
.a4-content blockquote {
  border-left: 4px solid #cbd5e1;
  padding-left: 12px;
  margin: 12px 0;
  color: #475569;
  font-style: italic;
}
.a4-content table {
  width: 100%;
  border-collapse: collapse;
  font-family: Inter, system-ui, sans-serif;
  font-size: 12.5px;
  margin: 14px 0;
}
.a4-content th, .a4-content td {
  border: 1px solid #e2e8f0;
  padding: 8px 10px;
  text-align: left;
  vertical-align: top;
}
.a4-content thead th { background: #f1f5f9; font-weight: 700; }
.page-number {
  position: absolute;
  bottom: 16px;
  right: 20px;
  background: rgba(15, 23, 42, 0.05);
  color: #475569;
  font-family: Inter, sans-serif;
  font-weight: 700;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid rgba(15, 23, 42, 0.07);
  user-select: none;
  pointer-events: none;
}

/* ===== Figures ===== */
.tp-figure {
  position: relative;
  display: block;
  max-width: 100%;
  margin: 18px auto;
  text-align: center;
  page-break-inside: avoid;
}
.tp-figure img {
  max-width: 100%;
  max-height: 420px;
  height: auto;
  width: auto;
  object-fit: contain;
  border: 1px solid #e2e8f0;
  border-radius: 4px;
  background: #f8fafc;
  display: block;
  margin: 0 auto;
  cursor: pointer;
  user-select: none;
  -webkit-user-drag: none;
}
.tp-figure.selected img {
  outline: 2px solid #087447;
  outline-offset: 3px;
}
.tp-figure .fig-caption {
  display: block;
  margin-top: 8px;
  font-family: Inter, sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: #334155;
  text-align: center;
}
.tp-figure .fig-label { font-weight: 800; color: #0f172a; }
.fig-main-label {
  display: block;
  margin: 0 0 6px;
  font-weight: 700;
  font-size: 13px;
  color: #0f172a;
  font-family: Inter, sans-serif;
}
.tp-figure-handles {
  display: none;
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}
.tp-figure.selected .tp-figure-handles { display: block; }
.tp-handle {
  position: absolute;
  width: 14px; height: 14px;
  background: #087447;
  border: 2px solid #fff;
  border-radius: 50%;
  pointer-events: auto;
  cursor: move;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
  z-index: 6;
}
.tp-handle.move {
  top: -7px; left: 50%;
  transform: translateX(-50%);
  cursor: grab;
}
.tp-handle.resize {
  top: 50%; left: -7px;
  transform: translateY(-50%);
  cursor: ew-resize;
}
.tp-handle.delete {
  top: -10px; right: -10px;
  width: 22px; height: 22px;
  background: #ef4444;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  border: 2px solid #fff;
}

.tp-image-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: min(78%, 520px);
  min-height: 140px;
  margin: 20px auto;
  padding: 18px 14px;
  border: 2px dashed rgba(8,116,71,.48);
  border-radius: 12px;
  background: rgba(8,116,71,.045);
  color: #0f172a;
  text-align: center;
  cursor: pointer;
  user-select: none;
}
.tp-image-placeholder:hover {
  background: rgba(8,116,71,.1);
  outline: 2px solid rgba(8,116,71,.2);
}
.tp-placeholder-icon {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #087447;
  color: #fff;
  font-size: 22px;
}
.tp-placeholder-action {
  color: #087447;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .08em;
}
.tp-image-placeholder small {
  max-width: 95%;
  color: #52616b;
  font-size: 12px;
  line-height: 1.45;
}

/* ===== Image panel ===== */
.image-panel-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(2, 6, 23, 0.55);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
}
.image-panel-backdrop.show { display: flex; }
.image-panel {
  width: min(520px, 100%);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
  box-shadow: var(--shadow);
  max-height: 90dvh;
  overflow: auto;
}
.image-panel h3 {
  font-size: 15px;
  font-weight: 750;
  margin-bottom: 6px;
}
.image-panel .hint {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 12px;
}
.dropzone {
  border: 1.5px dashed rgba(8,116,71,0.45);
  border-radius: 12px;
  padding: 18px 14px;
  text-align: center;
  cursor: pointer;
  background: rgba(8,116,71,0.08);
  margin-bottom: 12px;
}
.dropzone:hover, .dropzone.dragover {
  border-color: #087447;
  background: rgba(8,116,71,0.16);
}
.preview-box {
  min-height: 80px;
  max-height: 180px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  overflow: hidden;
  background: rgba(255,255,255,0.03);
}
.preview-box img {
  max-width: 100%;
  max-height: 170px;
  object-fit: contain;
}
.image-panel input[type="text"] {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(2,30,20,0.35);
  color: var(--text);
  margin-bottom: 12px;
  outline: none;
}
.image-panel .row-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  flex-wrap: wrap;
}
.status-line {
  margin-top: 10px;
  min-height: 16px;
  font-size: 12px;
  color: var(--muted);
}
.status-line.error { color: #fca5a5; }
.status-line.success { color: #a7f3d0; }

/* ===== Status bar ===== */
.status-bar {
  flex-shrink: 0;
  height: var(--status-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  border-top: 1px solid var(--border);
  background: rgba(6, 36, 28, 0.96);
  font-size: 11.5px;
  color: var(--muted);
}
.status-bar .dirty { color: #fbbf24; }
.status-bar .saved { color: var(--success); }

.empty-state {
  max-width: 420px;
  margin: 80px auto;
  text-align: center;
  color: var(--muted);
  line-height: 1.7;
  padding: 28px 20px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: rgba(255,255,255,0.03);
}
.empty-state h2 {
  color: var(--text);
  font-size: 20px;
  margin-bottom: 10px;
}

@media (max-width: 720px) {
  .a4-page {
    min-height: auto;
    padding: 28px 16px 48px;
    font-size: 14px;
  }
  .a4-content { min-height: 420px; }
  .a4-content h1 { font-size: 20px; }
  .top-title { display: none; }
  .brand span { display: none; }
  .chip-btn { padding: 0 10px; }
}
@media print {
  .topbar, .toolbar, .status-bar, .image-panel-backdrop { display: none !important; }
  .workspace { padding: 0; overflow: visible; background: #fff; }
  .a4-page {
    box-shadow: none;
    border: none;
    page-break-after: always;
    min-height: 297mm;
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-dot"></div>
      <span>Monkey Scout</span>
    </div>
    <div class="top-title" id="docTitle">Paper Editor</div>
    <div class="top-actions">
      <button class="chip-btn" id="btnCancel" type="button" title="Discard changes and return">Cancel</button>
      <button class="chip-btn primary" id="btnSave" type="button" title="Save changes">Save</button>
      <button class="chip-btn" id="btnBack" type="button" title="Back to dashboard">Back</button>
    </div>
  </header>

  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting">
    <div class="tb-group">
      <button class="tb-btn" data-cmd="undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.7 3L3 13"/></svg></button>
      <button class="tb-btn" data-cmd="redo" title="Redo"><svg viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6.7 3L21 13"/></svg></button>
    </div>
    <div class="tb-group">
      <select class="tb-select" id="blockStyle" title="Paragraph style">
        <option value="p">Body</option>
        <option value="h1">Heading 1</option>
        <option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option>
      </select>
    </div>
    <div class="tb-group">
      <button class="tb-btn" data-cmd="bold" title="Bold"><b>B</b></button>
      <button class="tb-btn" data-cmd="italic" title="Italic"><i>I</i></button>
      <button class="tb-btn" data-cmd="underline" title="Underline"><u>U</u></button>
      <button class="tb-btn" data-cmd="strikeThrough" title="Strikethrough"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M16 6a5 5 0 0 0-8 3.5"/><path d="M8 18a5 5 0 0 0 8-3.5"/></svg></button>
    </div>
    <div class="tb-group">
      <button class="tb-btn" data-cmd="justifyLeft" title="Align left"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h14"/></svg></button>
      <button class="tb-btn" data-cmd="justifyCenter" title="Center"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M5 18h14"/></svg></button>
      <button class="tb-btn" data-cmd="justifyRight" title="Align right"><svg viewBox="0 0 24 24"><path d="M4 6h16M10 12h10M6 18h14"/></svg></button>
      <button class="tb-btn" data-cmd="justifyFull" title="Justify"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
    <div class="tb-group">
      <button class="tb-btn" data-cmd="insertUnorderedList" title="Bullet list"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg></button>
      <button class="tb-btn" data-cmd="insertOrderedList" title="Numbered list"><svg viewBox="0 0 24 24"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M4 6h1v4M3.5 16.5c.5-.8 1.5-1 2-.5s.5 1.5-.5 2c1 .5 1.5 1.5.5 2.2-.8.5-2 .3-2.5-.5"/></svg></button>
      <button class="tb-btn" data-cmd="indent" title="Increase indent"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h9M3 18h18M14 9l4 3-4 3"/></svg></button>
      <button class="tb-btn" data-cmd="outdent" title="Decrease indent"><svg viewBox="0 0 24 24"><path d="M3 6h18M12 12h9M3 18h18M9 9l-4 3 4 3"/></svg></button>
    </div>
    <div class="tb-group">
      <button class="tb-btn" id="btnAddImage" title="Add image"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg></button>
      <button class="tb-btn" data-cmd="removeFormat" title="Clear formatting"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7v12M15 7v12M6 19h12"/></svg></button>
    </div>
  </div>

  <main class="workspace" id="workspace">
    <div class="pages" id="pagesRoot"></div>
  </main>

  <div class="status-bar">
    <span id="statusLeft">Ready</span>
    <span id="statusRight">—</span>
  </div>
</div>

<div class="image-panel-backdrop" id="imageBackdrop" aria-hidden="true">
  <div class="image-panel" role="dialog" aria-label="Add image">
    <h3 id="imagePanelTitle">Add image</h3>
    <div class="hint">Choose a photo from your device. Academic figure labels are applied automatically, matching the dashboard workflow.</div>
    <div class="dropzone" id="dropZone" tabindex="0">
      <div style="font-size:22px;margin-bottom:6px">⬆</div>
      <div style="font-weight:650;font-size:13.5px">Tap or drop image here</div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:4px">JPG, PNG, GIF, WebP · max 8 MB</div>
      <input type="file" id="imageFile" accept="image/*" hidden />
    </div>
    <div class="preview-box" id="imagePreview"><span style="color:var(--muted);font-size:13px">No image selected</span></div>
    <input type="text" id="imageCaption" placeholder="Caption / sub-label (optional)" />
    <div class="row-actions">
      <button class="chip-btn" type="button" id="imageCancel">Cancel</button>
      <button class="chip-btn primary" type="button" id="imageUpload">Upload & Insert</button>
    </div>
    <div class="status-line" id="imageStatus"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const LS_DOC = "monkeyScoutEditorDoc";
  const LS_EDITED = "monkeyScoutEditedDoc";
  const LS_RETURN = "monkeyScoutEditorReturn";
  const LS_UID = "monkeyScoutEditorUserId";
  const LS_PID = "monkeyScoutEditorProjectId";
  const LS_API = "monkeyScoutApiUrl";
  const LS_DIRTY = "monkeyScoutEditorDirty";
  const RICH_MARKER = "[[TEMPAPER_RICH_HTML]]";

  const pagesRoot = document.getElementById("pagesRoot");
  const workspace = document.getElementById("workspace");
  const statusLeft = document.getElementById("statusLeft");
  const statusRight = document.getElementById("statusRight");
  const btnSave = document.getElementById("btnSave");
  const btnCancel = document.getElementById("btnCancel");
  const btnBack = document.getElementById("btnBack");
  const btnAddImage = document.getElementById("btnAddImage");
  const blockStyle = document.getElementById("blockStyle");

  let originalHTML = "";
  let dirty = false;
  let figureCounterByChapter = {};
  let activePlaceholder = null;
  let selectedFile = null;
  let objectUrl = null;
  let lastFocusedContent = null;

  function setStatus(msg, kind) {
    statusLeft.textContent = msg || "Ready";
    statusLeft.className = kind || "";
  }

  function markDirty(v) {
    dirty = !!v;
    try { localStorage.setItem(LS_DIRTY, dirty ? "1" : "0"); } catch (_) {}
    statusRight.textContent = dirty ? "Unsaved changes" : "Saved";
    statusRight.className = dirty ? "dirty" : "saved";
  }

  function escapeHTML(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function getApiUrl() {
    try { return localStorage.getItem(LS_API) || "https://term-paper-n4kl.onrender.com"; }
    catch (_) { return "https://term-paper-n4kl.onrender.com"; }
  }

  function getUserId() {
    try {
      return localStorage.getItem(LS_UID) || localStorage.getItem("user_id") || "";
    } catch (_) { return ""; }
  }

  function getProjectId() {
    try { return localStorage.getItem(LS_PID) || ""; }
    catch (_) { return ""; }
  }

  /* ---------- Load document ---------- */
  function loadDocument() {
    let html = "";
    try { html = localStorage.getItem(LS_DOC) || ""; } catch (_) {}
    if (!html.trim()) {
      pagesRoot.innerHTML = `
        <div class="empty-state">
          <h2>No paper loaded</h2>
          <p>Open a merged paper from the dashboard and tap <strong>Edit Paper</strong>. This editor receives the live A4 pages from your workspace.</p>
          <p style="margin-top:14px"><button class="chip-btn primary" type="button" id="emptyBack">Back to dashboard</button></p>
        </div>`;
      document.getElementById("emptyBack")?.addEventListener("click", () => leave(false));
      setStatus("No document in session storage");
      return;
    }

    // Accept either a full pages container or a list of .a4-page nodes.
    const tmp = document.createElement("div");
    tmp.innerHTML = html;
    let pages = [...tmp.querySelectorAll(".a4-page")];
    if (!pages.length) {
      // Treat raw rich HTML as a single page
      const page = document.createElement("div");
      page.className = "a4-page";
      page.innerHTML = `<div class="a4-content" contenteditable="true">${html}</div><div class="page-number">1</div>`;
      pages = [page];
    }

    pagesRoot.innerHTML = "";
    pages.forEach((source, idx) => {
      const page = source.cloneNode(true);
      page.classList.add("a4-page");
      let content = page.querySelector(".a4-content");
      if (!content) {
        content = document.createElement("div");
        content.className = "a4-content";
        // Move children into content if the page was flat HTML
        while (page.firstChild && !page.firstChild.classList?.contains("page-number")) {
          content.appendChild(page.firstChild);
        }
        page.insertBefore(content, page.firstChild);
      }
      content.contentEditable = "true";
      content.spellcheck = true;
      content.dataset.placeholder = "Start typing…";
      // Strip interactive chrome that should be re-bound
      content.querySelectorAll(".tp-figure-handles, .tp-handle").forEach(n => n.remove());
      content.querySelectorAll(".tp-figure").forEach(f => {
        f.classList.remove("selected");
        delete f.dataset.bound;
      });
      if (!page.querySelector(".page-number")) {
        const pn = document.createElement("div");
        pn.className = "page-number";
        pn.textContent = String(idx + 1);
        page.appendChild(pn);
      }
      pagesRoot.appendChild(page);
    });

    originalHTML = serializePages();
    bindEditorEvents();
    bindFigureInteractions(pagesRoot);
    bindPlaceholders(pagesRoot);
    renumberPages();
    updateWordCount();
    markDirty(false);
    setStatus("Document loaded — edit freely");
  }

  function serializePages() {
    const clone = pagesRoot.cloneNode(true);
    clone.querySelectorAll(".a4-content").forEach(c => {
      c.removeAttribute("contenteditable");
      c.removeAttribute("spellcheck");
      c.removeAttribute("data-placeholder");
    });
    clone.querySelectorAll(".tp-figure").forEach(fig => {
      fig.classList.remove("selected");
      delete fig.dataset.bound;
      const handles = fig.querySelector(".tp-figure-handles");
      if (handles) handles.remove();
      const styleW = (fig.style && fig.style.width) || "";
      const m = styleW.match(/([\d.]+)%/);
      if (m) fig.setAttribute("data-fig-width", String(Math.round(parseFloat(m[1]))));
    });
    return clone.innerHTML;
  }

  function serializeRichForServer() {
    // Flatten page contents into one rich HTML blob for backend storage
    const parts = [];
    pagesRoot.querySelectorAll(".a4-content").forEach(c => {
      const clone = c.cloneNode(true);
      clone.querySelectorAll(".tp-figure-handles, .tp-handle").forEach(n => n.remove());
      clone.querySelectorAll(".tp-figure").forEach(fig => {
        fig.classList.remove("selected");
        delete fig.dataset.bound;
      });
      parts.push(clone.innerHTML);
    });
    return RICH_MARKER + parts.join("\n");
  }

  function renumberPages() {
    pagesRoot.querySelectorAll(".a4-page").forEach((page, i) => {
      const pn = page.querySelector(".page-number");
      if (pn && !pn.dataset.locked) {
        // Keep existing roman/arabic text if present; only fill empties
        if (!String(pn.textContent || "").trim()) pn.textContent = String(i + 1);
      }
    });
  }

  function updateWordCount() {
    const text = pagesRoot.innerText || "";
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    const pages = pagesRoot.querySelectorAll(".a4-page").length;
    statusRight.textContent = dirty
      ? `Unsaved · ${words} words · ${pages} page${pages === 1 ? "" : "s"}`
      : `${words} words · ${pages} page${pages === 1 ? "" : "s"}`;
  }

  /* ---------- Editing ---------- */
  function bindEditorEvents() {
    pagesRoot.querySelectorAll(".a4-content").forEach(content => {
      content.addEventListener("input", () => {
        markDirty(true);
        updateWordCount();
      });
      content.addEventListener("focus", () => { lastFocusedContent = content; });
      content.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          saveChanges();
        }
      });
    });

    document.getElementById("toolbar").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-cmd]");
      if (!btn) return;
      e.preventDefault();
      const cmd = btn.dataset.cmd;
      document.execCommand(cmd, false, null);
      markDirty(true);
      refreshToolbarState();
    });

    blockStyle.addEventListener("change", () => {
      const val = blockStyle.value;
      if (val === "p") document.execCommand("formatBlock", false, "p");
      else document.execCommand("formatBlock", false, val);
      markDirty(true);
    });

    document.addEventListener("selectionchange", refreshToolbarState);
  }

  function refreshToolbarState() {
    ["bold", "italic", "underline", "strikeThrough"].forEach(cmd => {
      const btn = document.querySelector(`[data-cmd="${cmd}"]`);
      if (!btn) return;
      try {
        btn.classList.toggle("active", document.queryCommandState(cmd));
      } catch (_) {}
    });
  }

  function ensureSelectionInEditor() {
    const sel = window.getSelection();
    if (sel && sel.rangeCount) {
      const node = sel.anchorNode;
      if (node && pagesRoot.contains(node)) return true;
    }
    if (lastFocusedContent) {
      lastFocusedContent.focus();
      return true;
    }
    const first = pagesRoot.querySelector(".a4-content");
    if (first) { first.focus(); return true; }
    return false;
  }

  /* ---------- Figures ---------- */
  function getChapterNumberFromContext(el) {
    const page = el?.closest?.(".a4-page") || el;
    const text = (page?.innerText || "").slice(0, 800);
    const m = text.match(/chapter\s+(\d+|i{1,3}|iv|v|vi{0,3}|ix|x|one|two|three|four|five|six|seven|eight|nine|ten)/i);
    if (!m) return 1;
    const token = m[1].toLowerCase();
    const words = { one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10 };
    const roman = { i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9,x:10 };
    if (/^\d+$/.test(token)) return parseInt(token, 10);
    return words[token] || roman[token] || 1;
  }

  function nextFigureLabel(nearEl) {
    const chap = getChapterNumberFromContext(nearEl);
    const key = String(chap);
    if (!figureCounterByChapter[key]) {
      const existing = (pagesRoot.innerText || "").match(new RegExp(`Fig\\.?\\s*${chap}\\.(\\d+)`, "gi")) || [];
      const nums = existing.map(s => {
        const mm = s.match(/(\d+)\.(\d+)/);
        return mm ? parseInt(mm[2], 10) : 0;
      });
      figureCounterByChapter[key] = (nums.length ? Math.max(...nums) : 0) + 1;
    }
    const idx = figureCounterByChapter[key]++;
    return { label: `Fig. ${chap}.${idx}`, chapter: chap, index: idx };
  }

  function buildFigureHTML(url, label, caption, widthPct, mainLabel) {
    const safeUrl = escapeHTML(url);
    const safeLabel = escapeHTML(label);
    const safeCap = escapeHTML(caption || "");
    const safeMain = escapeHTML(mainLabel || "");
    const figureId = "figure-" + String(label || "fig").toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + Date.now().toString(36);
    const w = Math.max(20, Math.min(100, Number(widthPct) || 70));
    return `<div class="tp-figure" data-fig-id="${figureId}" data-fig-label="${safeLabel}" data-fig-caption="${safeCap}" data-fig-main-label="${safeMain}" data-fig-url="${safeUrl}" data-fig-width="${w}" style="width:${w}%;max-width:100%;margin-left:auto;margin-right:auto">
  ${safeMain ? `<span class="fig-main-label">${safeMain}</span>` : ""}
  <img src="${safeUrl}" alt="${safeMain || safeLabel}" loading="lazy" draggable="false" />
  <span class="fig-caption"><span class="fig-label">${safeLabel}</span>${safeCap ? ": " + safeCap : ""}</span>
  <div class="tp-figure-handles">
    <div class="tp-handle move" title="Drag to move"></div>
    <div class="tp-handle resize" title="Resize"></div>
    <div class="tp-handle delete" title="Delete">×</div>
  </div>
</div>`;
  }

  function bindFigureInteractions(root) {
    (root || document).querySelectorAll(".tp-figure").forEach(fig => {
      const widthAttr = fig.getAttribute("data-fig-width") || fig.dataset.figWidth;
      if (widthAttr) {
        const w = Math.max(20, Math.min(100, parseFloat(widthAttr) || 70));
        fig.style.width = w + "%";
        fig.style.maxWidth = "100%";
        if (!fig.style.marginLeft) fig.style.marginLeft = "auto";
        if (!fig.style.marginRight) fig.style.marginRight = "auto";
      }
      if (!fig.querySelector(".tp-figure-handles")) {
        const h = document.createElement("div");
        h.className = "tp-figure-handles";
        h.innerHTML = '<div class="tp-handle move" title="Drag to move"></div><div class="tp-handle resize" title="Resize"></div><div class="tp-handle delete" title="Delete">×</div>';
        fig.appendChild(h);
      }
      if (fig.dataset.bound === "1") return;
      fig.dataset.bound = "1";

      const moveH = fig.querySelector(".tp-handle.move");
      const resizeH = fig.querySelector(".tp-handle.resize");
      const delH = fig.querySelector(".tp-handle.delete");

      fig.addEventListener("click", (e) => {
        if (e.target.closest(".tp-handle")) return;
        document.querySelectorAll(".tp-figure.selected").forEach(f => f.classList.remove("selected"));
        fig.classList.add("selected");
      });

      if (delH) {
        delH.addEventListener("click", (e) => {
          e.stopPropagation();
          if (!confirm("Delete this figure?")) return;
          fig.remove();
          markDirty(true);
          updateWordCount();
        });
      }

      if (moveH) {
        const begin = (e) => {
          e.preventDefault(); e.stopPropagation();
          fig.classList.add("selected");
          const clientX0 = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY0 = e.touches ? e.touches[0].clientY : e.clientY;
          const style = window.getComputedStyle(fig);
          const startMargin = parseFloat(style.marginLeft) || 0;
          let lastSwapY = clientY0;
          const onMove = (ev) => {
            const pt = ev.touches ? ev.touches[0] : ev;
            const dx = pt.clientX - clientX0;
            fig.style.marginLeft = Math.max(0, startMargin + dx) + "px";
            fig.style.marginRight = "auto";
            const contentRoot = fig.closest(".a4-content") || fig.parentElement;
            if (Math.abs(pt.clientY - lastSwapY) > 28 && contentRoot) {
              const blocks = [...contentRoot.children].filter(n => n.nodeType === 1);
              const idx = blocks.indexOf(fig);
              if (idx >= 0) {
                if (pt.clientY < lastSwapY && idx > 0) {
                  contentRoot.insertBefore(fig, blocks[idx - 1]);
                  lastSwapY = pt.clientY;
                } else if (pt.clientY > lastSwapY && idx < blocks.length - 1) {
                  const next = blocks[idx + 1];
                  if (next.nextSibling) contentRoot.insertBefore(fig, next.nextSibling);
                  else contentRoot.appendChild(fig);
                  lastSwapY = pt.clientY;
                }
              }
            }
            // Cross-page move
            const under = document.elementFromPoint(pt.clientX, pt.clientY);
            const targetContent = under && under.closest ? under.closest(".a4-content") : null;
            if (targetContent && pagesRoot.contains(targetContent) && targetContent !== fig.closest(".a4-content")) {
              targetContent.appendChild(fig);
              lastSwapY = pt.clientY;
            }
            if (ev.cancelable) ev.preventDefault();
          };
          const onUp = () => {
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
            document.removeEventListener("touchmove", onMove);
            document.removeEventListener("touchend", onUp);
            markDirty(true);
          };
          document.addEventListener("mousemove", onMove, { passive: false });
          document.addEventListener("mouseup", onUp);
          document.addEventListener("touchmove", onMove, { passive: false });
          document.addEventListener("touchend", onUp);
        };
        moveH.addEventListener("mousedown", begin);
        moveH.addEventListener("touchstart", begin, { passive: false });
      }

      if (resizeH) {
        const begin = (e) => {
          e.preventDefault(); e.stopPropagation();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const startW = fig.getBoundingClientRect().width;
          const parentW = (fig.parentElement && fig.parentElement.getBoundingClientRect().width) || startW;
          const onMove = (ev) => {
            const x = ev.touches ? ev.touches[0].clientX : ev.clientX;
            const dx = clientX - x;
            const newW = Math.max(120, Math.min(parentW, startW + dx));
            const pct = Math.round((newW / parentW) * 100);
            const clamped = Math.max(20, Math.min(100, pct));
            fig.style.width = clamped + "%";
            fig.setAttribute("data-fig-width", String(clamped));
            if (ev.cancelable) ev.preventDefault();
          };
          const onUp = () => {
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
            document.removeEventListener("touchmove", onMove);
            document.removeEventListener("touchend", onUp);
            markDirty(true);
          };
          document.addEventListener("mousemove", onMove, { passive: false });
          document.addEventListener("mouseup", onUp);
          document.addEventListener("touchmove", onMove, { passive: false });
          document.addEventListener("touchend", onUp);
        };
        resizeH.addEventListener("mousedown", begin);
        resizeH.addEventListener("touchstart", begin, { passive: false });
      }
    });
  }

  function bindPlaceholders(root) {
    (root || document).querySelectorAll(".tp-image-placeholder").forEach(ph => {
      if (ph.dataset.bound === "1") return;
      ph.dataset.bound = "1";
      ph.addEventListener("click", () => openImagePanel(ph));
      ph.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openImagePanel(ph); }
      });
      // Direct drop onto placeholder
      ph.addEventListener("dragover", (e) => { e.preventDefault(); ph.classList.add("dragover"); });
      ph.addEventListener("dragleave", () => ph.classList.remove("dragover"));
      ph.addEventListener("drop", (e) => {
        e.preventDefault();
        ph.classList.remove("dragover");
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) openImagePanel(ph, f);
      });
    });
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".tp-figure") && !e.target.closest(".tp-handle")) {
      document.querySelectorAll(".tp-figure.selected").forEach(f => f.classList.remove("selected"));
    }
  });

  /* ---------- Image panel ---------- */
  const backdrop = document.getElementById("imageBackdrop");
  const dropZone = document.getElementById("dropZone");
  const imageFile = document.getElementById("imageFile");
  const imagePreview = document.getElementById("imagePreview");
  const imageCaption = document.getElementById("imageCaption");
  const imageStatus = document.getElementById("imageStatus");
  const imageUpload = document.getElementById("imageUpload");
  const imageCancel = document.getElementById("imageCancel");
  const imagePanelTitle = document.getElementById("imagePanelTitle");

  function openImagePanel(placeholder, preselected) {
    activePlaceholder = placeholder || null;
    selectedFile = null;
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
    imagePreview.innerHTML = '<span style="color:var(--muted);font-size:13px">No image selected</span>';
    imageStatus.textContent = "";
    imageStatus.className = "status-line";
    imageCaption.value = placeholder ? (placeholder.dataset.figCaption || "") : "";
    imagePanelTitle.textContent = placeholder ? "Fill illustration position" : "Add image";
    if (placeholder && placeholder.dataset.figMainLabel) {
      imagePanelTitle.textContent = placeholder.dataset.figMainLabel;
    }
    backdrop.classList.add("show");
    backdrop.setAttribute("aria-hidden", "false");
    if (preselected) acceptFile(preselected);
  }

  function closeImagePanel() {
    backdrop.classList.remove("show");
    backdrop.setAttribute("aria-hidden", "true");
    activePlaceholder = null;
    selectedFile = null;
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
  }

  function acceptFile(f) {
    if (!f) return;
    if (!/^image\//i.test(f.type) && !/\.(jpe?g|png|gif|webp|bmp)$/i.test(f.name || "")) {
      imageStatus.textContent = "Please choose an image file.";
      imageStatus.className = "status-line error";
      return;
    }
    if (f.size > 8 * 1024 * 1024) {
      imageStatus.textContent = "Image must be under 8 MB.";
      imageStatus.className = "status-line error";
      return;
    }
    selectedFile = f;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(f);
    imagePreview.innerHTML = `<img src="${objectUrl}" alt="preview" />`;
    imageStatus.textContent = f.name || "Image selected";
    imageStatus.className = "status-line success";
  }

  dropZone.addEventListener("click", () => imageFile.click());
  imageFile.addEventListener("change", () => acceptFile(imageFile.files && imageFile.files[0]));
  ["dragenter", "dragover"].forEach(ev => dropZone.addEventListener(ev, (e) => {
    e.preventDefault(); dropZone.classList.add("dragover");
  }));
  ["dragleave", "dragend"].forEach(ev => dropZone.addEventListener(ev, (e) => {
    e.preventDefault(); dropZone.classList.remove("dragover");
  }));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    acceptFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
  });
  imageCancel.addEventListener("click", closeImagePanel);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeImagePanel(); });

  imageUpload.addEventListener("click", async () => {
    if (!selectedFile) {
      imageStatus.textContent = "Choose an image first.";
      imageStatus.className = "status-line error";
      return;
    }
    imageUpload.disabled = true;
    imageUpload.textContent = "Uploading…";
    imageStatus.textContent = "Uploading to ImgBB…";
    imageStatus.className = "status-line";
    try {
      const form = new FormData();
      form.append("image", selectedFile);
      form.append("user_id", getUserId());
      form.append("project_id", getProjectId());
      form.append("order_no", "0");
      const res = await fetch(`${getApiUrl()}/upload-image`, { method: "POST", body: form });
      let data = {};
      try { data = await res.json(); } catch (_) {}
      if (!res.ok || !data.url) throw new Error(data.error || `Upload failed (${res.status})`);

      const near = activePlaceholder || lastFocusedContent || pagesRoot.querySelector(".a4-content");
      const { label } = nextFigureLabel(near);
      const mainLabel = activePlaceholder ? (activePlaceholder.dataset.figMainLabel || "") : "";
      const caption = (imageCaption.value || "").trim() || (activePlaceholder ? (activePlaceholder.dataset.figCaption || "") : "");
      const figHtml = buildFigureHTML(data.url, label, caption, 70, mainLabel);

      if (activePlaceholder && activePlaceholder.parentNode) {
        const wrap = document.createElement("div");
        wrap.innerHTML = figHtml;
        const node = wrap.firstElementChild;
        activePlaceholder.replaceWith(node);
      } else {
        ensureSelectionInEditor();
        const sel = window.getSelection();
        if (sel && sel.rangeCount && pagesRoot.contains(sel.anchorNode)) {
          const range = sel.getRangeAt(0);
          range.collapse(false);
          const wrap = document.createElement("div");
          wrap.innerHTML = figHtml;
          const node = wrap.firstElementChild;
          range.insertNode(node);
        } else if (lastFocusedContent) {
          lastFocusedContent.insertAdjacentHTML("beforeend", figHtml);
        } else {
          const first = pagesRoot.querySelector(".a4-content");
          if (first) first.insertAdjacentHTML("beforeend", figHtml);
        }
      }

      bindFigureInteractions(pagesRoot);
      bindPlaceholders(pagesRoot);
      markDirty(true);
      updateWordCount();
      imageStatus.textContent = `Inserted as ${label}`;
      imageStatus.className = "status-line success";
      setTimeout(closeImagePanel, 700);
    } catch (err) {
      let msg = err.message || "Upload failed";
      if (/failed to fetch|networkerror|load failed/i.test(msg)) {
        msg = "Could not reach the upload server. Confirm the API is online and IMGBB_API_KEY is set.";
      }
      imageStatus.textContent = msg;
      imageStatus.className = "status-line error";
    } finally {
      imageUpload.disabled = false;
      imageUpload.textContent = "Upload & Insert";
    }
  });

  btnAddImage.addEventListener("click", () => {
    ensureSelectionInEditor();
    openImagePanel(null);
  });

  /* ---------- Save / Cancel / Back ---------- */
  async function saveChanges() {
    const html = serializePages();
    const rich = serializeRichForServer();
    btnSave.disabled = true;
    btnSave.textContent = "Saving…";
    setStatus("Saving…");

    try {
      // Always publish to other tabs / dashboard via localStorage
      localStorage.setItem(LS_EDITED, html);
      localStorage.setItem(LS_DOC, html);
      // Trigger storage event for same-tab consumers that poll
      try {
        localStorage.setItem("monkeyScoutEditorSavedAt", String(Date.now()));
      } catch (_) {}

      const uid = getUserId();
      const pid = getProjectId();
      if (uid && pid && /^\d+$/.test(String(uid)) && /^\d+$/.test(String(pid))) {
        const res = await fetch(`${getApiUrl()}/pull-next`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: uid,
            project_id: Number(pid),
            action: "edit_merged",
            content: rich,
            inline_enabled: false
          })
        });
        let data = {};
        try { data = await res.json(); } catch (_) {}
        if (!res.ok) throw new Error(data.error || `Save failed (${res.status})`);
        setStatus(data.message || "Saved to your account", "saved");
      } else {
        setStatus("Saved locally (sign in + open a project to sync to server)", "saved");
      }

      originalHTML = html;
      markDirty(false);
      updateWordCount();
    } catch (err) {
      setStatus(err.message || "Save failed", "error");
      statusLeft.style.color = "#fca5a5";
      alert(err.message || "Could not save changes.");
    } finally {
      btnSave.disabled = false;
      btnSave.textContent = "Save";
      setTimeout(() => { statusLeft.style.color = ""; }, 2500);
    }
  }

  function leave(keepChanges) {
    if (!keepChanges && dirty) {
      const ok = confirm("Discard unsaved changes and return to the dashboard?");
      if (!ok) return;
      // Restore original snapshot so dashboard does not pick up partial edits
      try {
        localStorage.setItem(LS_DOC, originalHTML);
        localStorage.removeItem(LS_EDITED);
        localStorage.setItem(LS_DIRTY, "0");
      } catch (_) {}
    }
    // Prefer returning to opener if it still exists
    const ret = (() => { try { return localStorage.getItem(LS_RETURN) || "dashboard"; } catch (_) { return "dashboard"; } })();
    if (window.opener && !window.opener.closed) {
      try {
        if (keepChanges) {
          // Ensure opener sees the latest HTML
          localStorage.setItem(LS_EDITED, serializePages());
        }
      } catch (_) {}
      window.close();
      // If close is blocked, fall through
      setTimeout(() => { window.location.href = ret === "dashboard" ? "dashboard.html" : ret; }, 200);
      return;
    }
    window.location.href = ret === "dashboard" ? "dashboard.html" : (ret || "dashboard.html");
  }

  btnSave.addEventListener("click", saveChanges);
  btnCancel.addEventListener("click", () => leave(false));
  btnBack.addEventListener("click", () => {
    if (dirty) {
      const choice = confirm("You have unsaved changes.\n\nOK = Save & return\nCancel = stay here\n\n(Use Cancel button to discard.)");
      if (!choice) return;
      saveChanges().then(() => leave(true));
      return;
    }
    leave(true);
  });

  window.addEventListener("beforeunload", (e) => {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = "";
  });

  // Boot
  loadDocument();
})();
</script>
</body>
</html>
